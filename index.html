    if (n > 1) s += `<path class="g15-ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
    pts.forEach((p, i) => {
      if (p.pr) s += `<circle class="g15-pr" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="5"/>`;
      else if (n <= 40 || i === n - 1) s += `<circle class="g15-pt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i === n - 1 ? 4 : 2.6}"/>`;
    });
  }
  const k = Math.min(n, 5);
  const idx = []; for (let j = 0; j < k; j++) { const i = k === 1 ? 0 : Math.round(j * (n - 1) / (k - 1)); if (!idx.includes(i)) idx.push(i); }
  idx.forEach((i, j) => { s += `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${j === 0 && idx.length > 1 ? 'start' : j === idx.length - 1 && idx.length > 1 ? 'end' : 'middle'}">${esc(pts[i].lab)}</text>`; });
  s += `<line class="g15-xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="opacity:0"/><circle class="g15-xd" r="5" cx="0" cy="0" style="opacity:0"/><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  G15[id] = { xs: pts.map((p, i) => X(i)), ys: pts.map(p => Y(p.y)), pts, W, bar: o.type === 'bar' };
  return `<div class="g15"><div class="g15-ro" id="${id}-ro">${pts[n - 1].tip}</div>${s}</div>`;
}
function g_probe(e) {
  const svg = e.target && e.target.closest && e.target.closest('svg.g15s'); if (!svg) return;
  const c = G15[svg.dataset.id]; if (!c) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * c.W;
  let bi = 0, bd = 1e9; c.xs.forEach((x, i) => { const d = Math.abs(x - vx); if (d < bd) { bd = d; bi = i; } });
  const ro = document.getElementById(svg.dataset.id + '-ro'); if (ro) ro.innerHTML = c.pts[bi].tip;
  const xh = svg.querySelector('.g15-xh'), xd = svg.querySelector('.g15-xd');
  xh.setAttribute('x1', c.xs[bi]); xh.setAttribute('x2', c.xs[bi]); xh.style.opacity = 1;
  xd.setAttribute('cx', c.xs[bi]); xd.setAttribute('cy', c.ys[bi]); xd.style.opacity = c.bar ? 0 : 1;
}
document.addEventListener('pointerdown', g_probe, { passive: true });
document.addEventListener('pointermove', g_probe, { passive: true });

/* ---------- stan zakładki Wykresy ---------- */
let chRange = '12w', chEx = null, chMet = 'e1rm';
const RANGES = [['4w', '4 tyg.'], ['12w', '12 tyg.'], ['6m', '6 mies.'], ['1y', 'Rok'], ['all', 'Całość']];
const g_days = () => ({ '4w': 28, '12w': 84, '6m': 183, '1y': 365 }[chRange] || 0);
const g_from = () => { const d = g_days(); return d ? ymd(addDays(new Date(), -(d - 1))) : null; };
window.g_setRange = r => { chRange = r; RENDER.charts(); };
window.g_setEx = n => { chEx = n; RENDER.charts(); };
window.g_setMet = m => { chMet = m; RENDER.charts(); };

/* ---------- KPI ---------- */
function g_kpis(from) {
  const cur = g_inRange(from, null);
  let prev = null;
  if (from) { const sp = g_days(); prev = g_inRange(ymd(addDays(parseYmd(from), -sp)), ymd(addDays(parseYmd(from), -1))); }
  const agg = l => ({ n: l.length, vol: g_sum(l, g_vol), sets: g_sum(l, g_sets), prs: g_sum(l, h => (h.prs || []).length) });
  const a = agg(cur), b = prev ? agg(prev) : null;
  const dl = (x, y) => {
    if (!b || !y) return '';
    const p = Math.round((x - y) / y * 100);
    return `<span class="dl ${p > 0 ? 'up' : p < 0 ? 'dn' : ''}">${p > 0 ? '▲' : p < 0 ? '▼' : '•'} ${Math.abs(p)}%</span><span class="dl vs">vs poprz.</span>`;
  };
  const tile = (l, v, u, d) => `<div class="kpi"><small>${l}</small><b>${v}${u ? `<em>${u}</em>` : ''}</b><div>${d || '<span class="dl vs" style="padding:0">&nbsp;</span>'}</div></div>`;
  return `<div class="kpis">${tile('Treningi', a.n, '', dl(a.n, b && b.n))}${tile('Tonaż', fmt(a.vol), 'kg', dl(a.vol, b && b.vol))}${tile('Serie robocze', a.sets, '', dl(a.sets, b && b.sets))}${tile('Rekordy', a.prs, '', dl(a.prs, b && b.prs))}</div>`;
}

/* ---------- tonaż w czasie ---------- */
function g_volBlock(from) {
  const hist = g_inRange(from, null);
  if (!hist.length) return `<div class="empty">Brak treningów w tym zakresie.</div>`;
  const first = from ? parseYmd(from) : parseYmd(hist[hist.length - 1].date);
  const startMon = mondayOf(first), endMon = mondayOf(new Date());
  const weeks = Math.round((endMon - startMon) / (7 * MS_DAY)) + 1, monthly = weeks > 26, bk = [];
  if (!monthly) {
    for (let i = 0; i < weeks; i++) { const m = addDays(startMon, i * 7); bk.push({ s: ymd(m), e: ymd(addDays(m, 6)), lab: g_short(ymd(m)), vol: 0, n: 0, sets: 0 }); }
  } else {
    let d = new Date(first.getFullYear(), first.getMonth(), 1); const now = new Date();
    while (d <= now) {
      const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      bk.push({ s: ymd(d), e: ymd(e), lab: MONTH_SHORT[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), vol: 0, n: 0, sets: 0 });
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    }
  }
  hist.forEach(h => { const b = bk.find(x => h.date >= x.s && h.date <= x.e); if (b) { b.vol += g_vol(h); b.n++; b.sets += g_sets(h); } });
  const win = monthly ? 3 : 4;
  const ma = bk.map((b, i) => i < win - 1 ? null : g_sum(bk.slice(i - win + 1, i + 1), x => x.vol) / win);
  const pts = bk.map(b => ({
    y: b.vol, lab: b.lab,
    tip: `<b>${fmt(b.vol)} kg</b><span>${monthly ? b.lab : g_short(b.s) + ' – ' + g_short(b.e)} · ${b.n} ${g_pl(b.n, 'trening', 'treningi', 'treningów')} · ${b.sets} ${g_pl(b.sets, 'seria', 'serie', 'serii')}</span>`
  }));
  const act = bk.filter(b => b.vol > 0), avg = act.length ? g_sum(act, b => b.vol) / act.length : 0;
  return g_chart('c-vol', { type: 'bar', pts, ma: bk.length >= win ? ma : null, zero: true, aria: 'Tonaż w czasie' }) +
    `<div class="g15-lg"><span><i class="bar"></i>${monthly ? 'tonaż miesięczny' : 'tonaż tygodniowy'}</span>${bk.length >= win ? `<span><i class="ma"></i>średnia krocząca (${win} ${monthly ? 'mies.' : 'tyg.'})</span>` : ''}</div>
    <div class="note-row" style="margin-top:12px">${ic('info')}<span>Średnio ${fmt(avg)} kg ${monthly ? 'miesięcznie' : 'tygodniowo'} (liczone z okresów z treningiem). Dotknij słupka, żeby zobaczyć szczegóły.</span></div>`;
}

/* ---------- progres w ćwiczeniu ---------- */
function g_exNames() {
  const m = {}; S.history.forEach(h => h.exercises.forEach(e => { if (workSets(e).length) m[e.name] = (m[e.name] || 0) + 1; }));
  return Object.entries(m).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function g_exSeries(name) {
  const out = [];
  [...S.history].reverse().forEach(h => {
    const e = h.exercises.find(x => x.name === name); if (!e) return;
    const ws = workSets(e).filter(s => s.weight > 0 && s.reps > 0); if (!ws.length) return;
    let b = ws[0]; ws.forEach(s => { if (e1rm(s.weight, s.reps) > e1rm(b.weight, b.reps)) b = s; });
    out.push({ d: h.date, t: parseYmd(h.date).getTime(), e: e1rm(b.weight, b.reps), w: Math.max(...ws.map(s => s.weight)), vol: g_sum(ws, s => s.weight * s.reps), best: b, sets: ws.length });
  });
  let run = 0; out.forEach((p, i) => { p.rec = i > 0 && p.e > run + 1e-6; if (p.e > run) run = p.e; });
  return out;
}
function g_exBlock(from) {
  const names = g_exNames();
  if (!names.length) return `<div class="empty">Zapisz trening z ciężarami, a zobaczysz tu progres w ćwiczeniach.</div>`;
  if (!chEx || !names.includes(chEx)) chEx = names[0];
  const mets = [['e1rm', 'Szac. 1RM', 'kg'], ['w', 'Ciężar roboczy', 'kg'], ['vol', 'Tonaż ćwiczenia', 'kg']];
  const mt = mets.find(m => m[0] === chMet) || mets[0];
  const sel = `<select class="in" aria-label="Wybierz ćwiczenie" onchange="g_setEx(this.value)">${names.map(n => `<option value="${esc(n)}" ${n === chEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <div class="chips" style="margin:12px 0 14px">${mets.map(m => `<button class="chip ${chMet === m[0] ? 'on' : ''}" onclick="g_setMet('${m[0]}')">${m[1]}</button>`).join('')}</div>`;
  const ser = g_exSeries(chEx).filter(p => !from || p.d >= from);
  if (ser.length < 2) return sel + `<div class="empty">Za mało danych w tym zakresie (potrzeba co najmniej 2 treningów tego ćwiczenia).</div>`;
  const val = p => chMet === 'w' ? p.w : chMet === 'vol' ? p.vol : p.e;
  const pts = ser.map(p => {
    const v = val(p), pr = p.rec && chMet !== 'vol';
    const det = chMet === 'e1rm' ? ` · ${p.best.weight} kg × ${p.best.reps}` : ` · ${p.sets} ${g_pl(p.sets, 'seria', 'serie', 'serii')}`;
    return { t: p.t, y: v, lab: g_short(p.d), pr, tip: `<b>${fmt1(v)} ${mt[2]}</b><span>${niceDate(p.d)}${det}${pr ? ' · rekord' : ''}</span>` };
  });
  const days = pts.map(p => p.t / MS_DAY), reg = pts.length >= 3 ? g_reg(days, pts.map(p => p.y)) : null;
  const tl = reg ? [reg.a + reg.b * days[0], reg.a + reg.b * days[days.length - 1]] : null;
  const f = pts[0].y, l = pts[pts.length - 1].y, best = Math.max(...pts.map(p => p.y)), d = l - f, pc = f ? Math.round(d / f * 100) : 0;
  const perMonth = reg && (days[days.length - 1] - days[0]) >= 14 ? reg.b * 30 : null;
  const ms = `<div class="ministats">
    <div><small>Zmiana</small><b class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${g_sign(d)} kg</b></div>
    <div><small>Zmiana %</small><b class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${pc > 0 ? '+' : pc < 0 ? '−' : ''}${Math.abs(pc)}%</b></div>
    <div><small>Najlepszy</small><b>${fmt1(best)}</b></div>
    <div><small>Trend / mies.</small><b class="${perMonth > 0 ? 'up' : perMonth < 0 ? 'dn' : ''}">${perMonth == null ? '—' : g_sign(perMonth)}</b></div></div>`;
  return sel + g_chart('c-ex', { pts, timeX: true, trendLine: tl, aria: 'Progres w ćwiczeniu ' + chEx }) +
    `<div class="g15-lg"><span><i></i>${mt[1]}</span><span><i class="pr"></i>rekord</span>${tl ? '<span><i class="tr"></i>trend liniowy</span>' : ''}</div>${ms}
    ${chMet === 'e1rm' ? `<div class="note-row" style="margin-top:12px">${ic('info')}<span>1RM to szacunek z najlepszej serii w treningu (wzór Epleya: ciężar × (1 + powtórzenia / 30)).</span></div>` : ''}`;
}

/* ---------- partie mięśniowe ---------- */
function g_muscleBlock(from) {
  const m = {}; g_inRange(from, null).forEach(h => h.exercises.forEach(e => { const k = e.muscle || muscleOf(e.name); m[k] = (m[k] || 0) + workSets(e).length; }));
  const rows = Object.entries(m).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return `<div class="empty">Brak serii w tym zakresie.</div>`;
  const tot = g_sum(rows, r => r[1]), mx = rows[0][1];
  const PUSH = ['Klatka', 'Barki', 'Triceps'], PULL = ['Plecy', 'Tył barków', 'Biceps'];
  const push = g_sum(rows.filter(r => PUSH.includes(r[0])), r => r[1]), pull = g_sum(rows.filter(r => PULL.includes(r[0])), r => r[1]);
  const bars = rows.map(([k, v]) => `<div class="mb"><span>${esc(k)}</span><div class="tr"><i style="width:${Math.max(4, Math.round(v / mx * 100))}%"></i></div><span class="v"><b>${v}</b> · ${Math.round(v / tot * 100)}%</span></div>`).join('');
  const pp = push && pull ? `<div class="pp"><div>Push (klatka, barki, triceps)<b>${push} serii</b></div><div>Pull (plecy, tył barków, biceps)<b>${pull} serii</b></div></div>
    <div class="note-row" style="margin-top:10px">${ic('info')}<span>Stosunek push : pull wynosi ${fmt1(push / pull)} : 1${push / pull > 1.3 ? ', przewaga pchania.' : push / pull < .77 ? ', przewaga ciągnięcia.' : ', zbliżony.'}</span></div>` : '';
  return bars + pp;
}

/* ---------- masa ciała ---------- */
function g_bwBlock(from) {
  const a = [...(S.bodyweight || [])].sort((x, y) => x.date.localeCompare(y.date));
  if (a.length < 2) return `<div class="empty">Dodaj co najmniej dwa pomiary wagi, żeby zobaczyć trend.<br><button class="btn sm" style="margin-top:12px" onclick="setProgView('body');go('progress')">Dodaj wagę</button></div>`;
  let r = from ? a.filter(x => x.date >= from) : a; if (r.length < 2) r = a.slice(-30);
  const ma = r.map((x, i) => { const w = a.slice(Math.max(0, a.indexOf(x) - 6), a.indexOf(x) + 1); return g_sum(w, z => z.kg) / w.length; });
  const pts = r.map((x, i) => ({ t: parseYmd(x.date).getTime(), y: x.kg, lab: g_short(x.date), tip: `<b>${fmt1(x.kg)} kg</b><span>${niceDate(x.date)} · średnia 7 pomiarów ${fmt1(ma[i])} kg</span>` }));
  const d = r[r.length - 1].kg - r[0].kg;
  return g_chart('c-bw', { pts, ma, timeX: true, aria: 'Masa ciała' }) +
    `<div class="g15-lg"><span><i></i>pomiar</span><span><i class="ma"></i>średnia krocząca (7)</span></div>
    <div class="ministats" style="grid-template-columns:repeat(3,1fr)"><div><small>Teraz</small><b>${fmt1(r[r.length - 1].kg)} kg</b></div><div><small>Zmiana w okresie</small><b class="">${g_sign(d)} kg</b></div><div><small>Min – max</small><b>${fmt1(Math.min(...r.map(x => x.kg)))}–${fmt1(Math.max(...r.map(x => x.kg)))}</b></div></div>`;
}

/* ---------- regularność (mapa cieplna) ---------- */
const HM_DAYS = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'];
function g_heat() {
  const weeks = 16, today = new Date(), startMon = addDays(mondayOf(today), -7 * (weeks - 1)), tStr = ymd(today);
  const byDay = {}; S.history.forEach(h => { byDay[h.date] = (byDay[h.date] || 0) + g_vol(h); });
  const nz = []; for (let i = 0; i < weeks * 7; i++) { const d = ymd(addDays(startMon, i)); if (byDay[d]) nz.push(byDay[d]); }
  nz.sort((a, b) => a - b);
  const q = p => nz.length ? nz[Math.min(nz.length - 1, Math.floor(p * nz.length))] : 0, t1 = q(.25), t2 = q(.5), t3 = q(.75);
  const lvl = v => !v ? 0 : v <= t1 ? 1 : v <= t2 ? 2 : v <= t3 ? 3 : 4;
  const OP = [.07, .3, .5, .75, 1], Lm = 20, cs = (340 - Lm) / weeks, sz = cs - 3.5;
  let s = `<svg class="g15s" viewBox="0 0 340 ${(7 * cs + 16).toFixed(0)}" role="img" aria-label="Regularność treningów">`;
  HM_DAYS.forEach((n, r) => { if (r % 2 === 0) s += `<text x="0" y="${(16 + r * cs + cs / 2 + 3).toFixed(1)}">${n}</text>`; });
  let lastM = -1;
  for (let w = 0; w < weeks; w++) {
    const mon = addDays(startMon, w * 7);
    if (mon.getMonth() !== lastM) { lastM = mon.getMonth(); s += `<text x="${(Lm + w * cs).toFixed(1)}" y="9">${MONTH_SHORT[lastM]}</text>`; }
    for (let r = 0; r < 7; r++) {
      const dt = addDays(mon, r), ds = ymd(dt); if (ds > tStr) continue;
      const v = byDay[ds] || 0, l = lvl(v);
      s += `<rect x="${(Lm + w * cs).toFixed(1)}" y="${(16 + r * cs).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" rx="5" style="fill:${l ? 'var(--acc)' : 'var(--chalk)'};fill-opacity:${OP[l]};${ds === tStr ? 'stroke:var(--chalk);stroke-width:1.5;' : ''}cursor:pointer" onclick="g_cell('${ds}')"/>`;
    }
  }
  s += '</svg>';
  const recent = S.history.filter(h => h.date >= ymd(startMon)), perWeek = recent.length / weeks, goal = S.settings.weeklyGoal || 4;
  let hit = 0; for (let w = 0; w < weeks - 1; w++) { if (weekSessions(addDays(startMon, w * 7)).length >= goal) hit++; }
  return `<div class="g15"><div class="g15-ro" id="hm-ro"><b>${fmt1(perWeek)}</b><span>treningów tygodniowo (ostatnie ${weeks} tyg.) · cel ${goal}/tydz. osiągnięty w ${hit} z ${weeks - 1} tyg.</span></div>${s}</div>
    <div class="g15-lg"><span>mniej</span><span style="display:flex;gap:4px;align-items:center">${[0, 1, 2, 3, 4].map(l => `<i class="bar" style="margin:0;opacity:${OP[l]};${l ? '' : 'background:var(--chalk)'}"></i>`).join('')}</span><span>więcej tonażu</span></div>`;
}
window.g_cell = ds => {
  const ro = $('#hm-ro'); if (!ro) return;
  const l = S.history.filter(h => h.date === ds);
  ro.innerHTML = l.length ? `<b>${fmt(g_sum(l, g_vol))} kg</b><span>${longDate(ds)} · ${l.map(h => esc(wTitle(h))).join(', ')}</span>` : `<b>—</b><span>${longDate(ds)} · dzień wolny</span>`;
};

/* ---------- łączny tonaż i porównania ---------- */
function g_ladderBlock() {
  const total = g_sum(S.history, g_vol), cur = g_eq(total), nxt = g_nextObj(total);
  const shown = LADDER.filter(x => x[0] <= total).slice(-8).concat(LADDER.filter(x => x[0] > total).slice(0, 3));
  const curW = cur ? cur.w : 0, prog = nxt ? Math.max(3, Math.round((total - curW) / (nxt[0] - curW) * 100)) : 100;
  return `<div class="bigq"><div class="em">${cur ? cur.em : '💪'}</div><div><b>${fmt(total)} kg</b><span>${cur ? `łącznie podniesione, ≈ ${cur.cs} × ${cur.name}` : 'łącznie podniesione. Pierwszy próg: duży arbuz (5 kg)'}</span></div></div>
    ${nxt ? `<div class="pbar"><i style="width:${prog}%"></i></div><div class="muted" style="font-size:12.5px;margin-top:8px;font-weight:600">Do „${nxt[1]}” ${nxt[2]} (${fmt(nxt[0])} kg) brakuje ${fmt(nxt[0] - total)} kg</div>` : ''}
    <div class="ladder">${shown.map(x => `<div class="lw ${x[0] > total ? 'lock' : ''} ${cur && x[0] === cur.w ? 'now' : ''}"><span>${x[2]}</span><small>${x[0] >= 1000 ? fmt1(x[0] / 1000) + ' t' : x[0] + ' kg'}<br>${esc(x[1])}</small></div>`).join('')}</div>`;
}

/* ---------- ostatnie rekordy ---------- */
function g_prBlock() {
  const l = []; S.history.forEach(h => (h.prs || []).forEach(p => l.push({ d: h.date, p })));
  if (!l.length) return `<div class="empty">Rekordy pojawią się tutaj, gdy je pobijesz.</div>`;
  return l.slice(0, 6).map(x => `<div class="prl">${ic('trophy')}<div><div class="n">${esc(x.p.name)}</div><div class="d">${niceDate(x.d)} · szac. 1RM ${fmt1(e1rm(x.p.weight, x.p.reps))} kg</div></div><div class="w">${x.p.weight} kg × ${x.p.reps}</div></div>`).join('');
}

/* ---------- ekran Wykresy ---------- */
RENDER.charts = function () {
  const from = g_from(), el = $('#s-charts');
  const head = `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px"><h1 class="h-xl">Wykresy</h1>
    <button class="sub-link" style="padding-bottom:6px" onclick="go('progress')">Rekordy i cele ${ic('chev-r')}</button></div>`;
  if (!S.history.length) { el.innerHTML = head + `<div class="empty" style="padding:34px 16px">Wykresy pojawią się po pierwszym zapisanym treningu.<br><button class="btn sm" style="margin-top:14px" onclick="go('workout')">Zacznij trening</button></div>`; return; }
  const sec = (t, sub, body) => `<div class="sec"><div class="sec-h"><h2>${t}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div><div class="panel">${body}</div></div>`;

};

<script>
(()=>{
 const oldFinishWorkout=window.finishWorkout;
 let gtMood='Dobrze',gtEnergy='Normalna',gtEffort='7',gtSleep='7',gtPain='Nie',gtComment='';
 const escGT=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.finishWorkout=async function(){
   if(!S.activeWorkout)return;
   openSheet(`<div class="gt-hero"><div class="gt-pill">PODSUMOWANIE SESJI</div><h3 class="sh-t" style="margin-top:10px">Jak poszedł trening?</h3><p class="gt-muted">Te odpowiedzi pomogą śledzić regenerację i samopoczucie. Możesz je pominąć.</p></div>
   <label class="fld">Samopoczucie po treningu</label><div class="gt-choices" id="gt-mood">${['Świetnie','Dobrze','Średnio','Słabo'].map(x=>`<button class="gt-choice ${x===gtMood?'on':''}" onclick="gtPick('mood','${x}',this)">${x}</button>`).join('')}</div>
   <label class="fld">Poziom energii</label><div class="gt-choices" id="gt-energy">${['Wysoka','Normalna','Niska'].map(x=>`<button class="gt-choice ${x===gtEnergy?'on':''}" onclick="gtPick('energy','${x}',this)">${x}</button>`).join('')}</div>
   <label class="fld">Jak ciężki był trening? (RPE 1–10)</label><div class="gt-choices" id="gt-effort">${['4','5','6','7','8','9','10'].map(x=>`<button class="gt-choice ${x===gtEffort?'on':''}" onclick="gtPick('effort','${x}',this)">${x}</button>`).join('')}</div>
   <label class="fld">Ile godzin spałeś ostatniej nocy?</label><input class="gt-input" id="gt-sleep" type="number" min="0" max="24" step="0.5" value="${gtSleep}">
   <label class="fld">Dyskomfort lub ból podczas treningu?</label><div class="gt-choices">${['Nie','Lekki','Wyraźny'].map(x=>`<button class="gt-choice ${x===gtPain?'on':''}" onclick="gtPick('pain','${x}',this)">${x}</button>`).join('')}</div>
   <label class="fld">Dodatkowe uwagi (opcjonalnie)</label><textarea class="gt-input" id="gt-comment" rows="2" placeholder="Np. dobra technika, mało energii, progres w wyciskaniu…">${escGT(gtComment)}</textarea>
   <button class="btn plan block" onclick="gtSubmitWellbeing()">Zapisz trening i podsumowanie</button><button class="btn ghost block" style="margin-top:8px" onclick="gtSubmitWellbeing(true)">Pomiń pytania i zapisz</button>`);
 };
 window.gtPick=function(k,v,el){if(k==='mood')gtMood=v;if(k==='energy')gtEnergy=v;if(k==='effort')gtEffort=v;if(k==='pain')gtPain=v;el.parentElement.querySelectorAll('.gt-choice').forEach(b=>b.classList.toggle('on',b===el));};
 window.gtSubmitWellbeing=function(skip=false){
   if(!skip){gtSleep=String(Math.max(0,Math.min(24,Number(document.getElementById('gt-sleep')?.value||0))));gtComment=document.getElementById('gt-comment')?.value||'';}
   const w=S.activeWorkout;if(w)w.wellbeing=skip?null:{mood:gtMood,energy:gtEnergy,effort:Number(gtEffort),sleep:Number(gtSleep),pain:gtPain,comment:gtComment};
   save();closeSheet();oldFinishWorkout();
 };
 window.showSummary=function(s,prev,badges){
   const volume=sessionVolume(s),pv=prev?sessionVolume(prev):0,diff=pv?Math.round((volume-pv)/pv*100):null;
   const allSets=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.type!=='w').length,0);
   const reps=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.type!=='w').reduce((b,x)=>b+Number(x.reps||0),0),0);
   const best=s.exercises.map(e=>({...e,best:Math.max(0,...e.sets.map(x=>Number(x.weight||0)))})).sort((a,b)=>b.best-a.best).slice(0,3);
   const comparisons=[{kg:5,emoji:'🐈',name:'kot domowy'},{kg:25,emoji:'🧳',name:'duża walizka'},{kg:50,emoji:'🛢️',name:'mała beczka'},{kg:100,emoji:'🏍️',name:'motocykl'},{kg:250,emoji:'🐻',name:'duży niedźwiedź'},{kg:500,emoji:'🐄',name:'krowa'},{kg:1000,emoji:'🚗',name:'mały samochód'},{kg:6000,emoji:'🐘',name:'słoń (orientacyjnie)'},{kg:10000000,emoji:'🗼',name:'wieża Eiffla (ok. 10 tys. ton)'}];
   let cmp=comparisons.filter(c=>volume>=c.kg).slice(-1)[0];
   const weekly=S.history.filter(h=>{const d=new Date(h.date+'T12:00:00'),n=new Date();const day=(n.getDay()+6)%7;const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day);return d>=mon;});
   const xp=200+150*(s.prs||[]).length,wb=s.wellbeing;
   openSheet(`<div class="gt-hero"><div class="gt-pill">${s.prs?.length?'🏆 NOWE REKORDY':'✓ TRENING ZAPISANY'}</div><h3 class="sh-t" style="font-size:25px;margin:10px 0 4px">Świetna robota!</h3><p class="gt-muted">${escGT(s.title||'Trening')} · ${escGT(niceDate(s.date))}</p><div class="gt-grid"><div class="gt-metric"><small>⏱️ Czas treningu</small><b>${s.duration} min</b><small>łączny czas sesji</small></div><div class="gt-metric"><small>🏋️ Tonaż</small><b>${fmt(volume)} kg</b><small>suma ciężar × powtórzenia</small></div><div class="gt-metric"><small>🔁 Serie robocze</small><b>${allSets}</b><small>${reps} powtórzeń łącznie</small></div><div class="gt-metric"><small>💪 Ćwiczenia</small><b>${s.exercises.length}</b><small>z wykonanymi seriami</small></div><div class="gt-metric"><small>⚡ XP</small><b>+${xp}</b><small>punkty za sesję</small></div><div class="gt-metric"><small>📅 Ten tydzień</small><b>${weekly.length}</b><small>zapisanych treningów</small></div></div></div>
   <div class="gt-section"><h3>📈 Porównanie z poprzednim treningiem</h3><div class="panel" style="padding:14px"><b>${diff===null?'Brak porównania':`${diff>=0?'+':''}${diff}% tonażu`}</b><p class="gt-muted" style="margin-top:5px">${diff===null?'Zapisz kolejny trening tego typu, a pokażemy zmianę tonażu.':`Poprzednio: ${fmt(pv)} kg · Teraz: ${fmt(volume)} kg.`}</p>${diff!==null?`<div class="gt-bar"><i style="--gt-width:${Math.max(4,Math.min(100,50+diff/2))}%"></i></div>`:''}</div></div>
   ${s.prs?.length?`<div class="gt-section"><h3>🏆 Nowe rekordy</h3><div class="panel" style="padding:14px">${s.prs.map(p=>`<div class="gt-row"><span class="gt-emoji">🏆</span><div class="grow"><b>${escGT(p.name)}</b><small>${p.weight} kg × ${p.reps} powtórzeń</small></div><span class="gt-pill">PR</span></div>`).join('')}</div></div>`:''}
   <div class="gt-section"><h3>🎯 Najcięższe ćwiczenia</h3><div class="panel" style="padding:14px">${best.map(e=>`<div class="gt-row"><div class="grow"><b>${escGT(e.name)}</b><small>${e.sets.length} zaliczonych serii</small></div><strong>${fmt(e.best)} kg</strong></div>`).join('')}</div></div>
   <div class="gt-section"><h3>🌍 Tonaż w skali świata</h3><div class="panel" style="padding:14px"><div class="gt-row"><span class="gt-emoji">${cmp?.emoji||'🏋️'}</span><div class="grow"><b>${cmp?`Tonaż podobny do masy: ${cmp.name}`:'Każda seria buduje progres'}</b><small>${cmp?`${fmt(volume)} kg łącznego tonażu. To tylko obrazowe porównanie, nie oznacza jednorazowego podniesienia tej masy.`:'Wraz ze wzrostem tonażu pojawią się kolejne porównania.'}</small></div></div><p class="gt-muted">Tonaż to suma ciężaru pomnożonego przez liczbę powtórzeń, a nie ciężar podniesiony jednocześnie.</p></div></div>
   <div class="gt-section"><h3>🧠 Samopoczucie i regeneracja</h3><div class="panel" style="padding:14px">${wb?`<div class="gt-row"><div class="grow"><b>Samopoczucie</b><small>${escGT(wb.mood)}</small></div><span>${wb.mood==='Świetnie'?'😄':wb.mood==='Dobrze'?'🙂':wb.mood==='Średnio'?'😐':'😕'}</span></div><div class="gt-row"><div class="grow"><b>Energia</b><small>${escGT(wb.energy)}</small></div><b>${escGT(wb.energy)}</b></div><div class="gt-row"><div class="grow"><b>Odczuwana trudność</b><small>RPE, skala 1–10</small></div><b>${wb.effort}/10</b></div><div class="gt-row"><div class="grow"><b>Sen</b><small>ostatnia noc</small></div><b>${wb.sleep} h</b></div><div class="gt-row"><div class="grow"><b>Dyskomfort</b></div><b>${escGT(wb.pain)}</b></div>${wb.comment?`<p style="margin-top:8px">${escGT(wb.comment)}</p>`:''}`:'<p class="gt-muted">Pominięto pytania o samopoczucie.</p>'}</div></div>
   ${badges?.length?`<div class="gt-section"><h3>🎖️ Odznaki</h3><div class="panel" style="padding:14px">${badges.map(b=>`<div class="gt-row"><span class="gt-emoji">🎖️</span><div class="grow"><b>${escGT(b.title)}</b><small>Nowe osiągnięcie</small></div></div>`).join('')}</div></div>`:''}
   <div class="gt-section"><h3>📌 Co dalej?</h3><div class="panel" style="padding:14px"><p class="gt-muted">Zapisuj wyniki konsekwentnie, zwiększaj obciążenie stopniowo i daj sobie czas na regenerację. Pojedynczy słabszy trening nie przekreśla progresu.</p><div class="row2"><button class="btn ghost" onclick="shareSummary(${s.id})">Udostępnij raport</button><button class="btn plan" onclick="closeSheet();go('progress')">Zobacz progres</button></div></div></div>` ,()=>{if(current==='workout')go('dash');});
   confetti(90);chime([523,659,784]);
 };
 function periodRender(period){
   const id=period==='week'?'weekreport':'monthreport';let el=document.getElementById('s-'+id);if(!el){el=document.createElement('section');el.id='s-'+id;el.className='screen hidden';document.querySelector('main')?.appendChild(el)||document.body.appendChild(el);}
   const now=new Date(),start=period==='week'?new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7)):new Date(now.getFullYear(),now.getMonth(),1);
   const end=period==='week'?new Date(start.getFullYear(),start.getMonth(),start.getDate()+7):new Date(now.getFullYear(),now.getMonth()+1,1);
   const arr=S.history.filter(h=>{const d=new Date(h.date+'T12:00:00');return d>=start&&d<end;});
   const volume=arr.reduce((a,h)=>a+sessionVolume(h),0),sets=arr.reduce((a,h)=>a+(h.completedSets||0),0),mins=arr.reduce((a,h)=>a+(h.duration||0),0),prs=arr.reduce((a,h)=>a+(h.prs||[]).length,0);
   const prevStart=period==='week'?new Date(start.getFullYear(),start.getMonth(),start.getDate()-7):new Date(now.getFullYear(),now.getMonth()-1,1),prevEnd=start;
   const old=S.history.filter(h=>{const d=new Date(h.date+'T12:00:00');return d>=prevStart&&d<prevEnd;});const ov=old.reduce((a,h)=>a+sessionVolume(h),0),delta=ov?Math.round((volume-ov)/ov*100):null;
   el.innerHTML=`<h1 class="h-xl">${period==='week'?'Podsumowanie tygodnia':'Podsumowanie miesiąca'}</h1><p class="gt-muted">${period==='week'?'Od poniedziałku do dziś':'Bieżący miesiąc'} · automatycznie z historii treningów</p><div class="gt-hero"><div class="gt-pill">${period==='week'?'📅 RAPORT TYGODNIOWY':'🗓️ RAPORT MIESIĘCZNY'}</div><h2 style="font-size:26px;margin:12px 0 4px">${arr.length} ${arr.length===1?'trening':arr.length>=2&&arr.length<=4?'treningi':'treningów'}</h2><p class="gt-muted">${delta===null?'Brak danych do porównania z poprzednim okresem':`${delta>=0?'+':''}${delta}% tonażu względem poprzedniego okresu`}</p></div><div class="gt-grid"><div class="gt-metric"><small>🏋️ Łączny tonaż</small><b>${fmt(volume)} kg</b><small>ciężar × powtórzenia</small></div><div class="gt-metric"><small>⏱️ Czas na siłowni</small><b>${Math.floor(mins/60)} h ${mins%60} min</b><small>łączny czas</small></div><div class="gt-metric"><small>🔁 Serie robocze</small><b>${sets}</b><small>wykonane serie</small></div><div class="gt-metric"><small>🏆 Rekordy</small><b>${prs}</b><small>nowe rekordy</small></div><div class="gt-metric"><small>📊 Średni tonaż</small><b>${arr.length?fmt(volume/arr.length):0} kg</b><small>na jeden trening</small></div><div class="gt-metric"><small>📈 Średnia długość</small><b>${arr.length?Math.round(mins/arr.length):0} min</b><small>na sesję</small></div></div><div class="gt-section"><h3>Historia okresu</h3><div class="panel" style="padding:14px">${arr.length?arr.map(h=>`<div class="gt-row"><div class="grow"><b>${escGT(h.title||'Trening')}</b><small>${escGT(niceDate(h.date))} · ${h.duration||0} min · ${h.completedSets||0} serii</small></div><b>${fmt(sessionVolume(h))} kg</b></div>`).join(''):'<p class="gt-muted">Brak zapisanych treningów w tym okresie. Gdy zapiszesz sesję, raport pojawi się tutaj.</p>'}</div></div><div class="gt-section"><h3>💡 Wnioski</h3><div class="panel" style="padding:14px"><p>${arr.length===0?'Zacznij od zapisania pierwszego treningu.':arr.length<2?'Masz już pierwszy zapis. Kolejne sesje pozwolą porównywać wyniki i zauważać trendy.':delta===null?'Masz kilka treningów w tym okresie. Kontynuuj regularne zapisy.':delta>0?'Tonaż wzrósł względem poprzedniego okresu. Pamiętaj, by progresować stopniowo i dbać o technikę.':delta<0?'Tonaż był niższy niż poprzednio. To może być naturalny lżejszy tydzień i element regeneracji.':'Tonaż utrzymał się na podobnym poziomie. Sprawdź technikę, sen i samopoczucie, zanim zwiększysz obciążenie.'}</p></div></div><button class="btn ghost block" style="margin-top:14px" onclick="go('dash')">Wróć do strony głównej</button>`;
   current=id;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('hidden',x!==el));document.querySelectorAll('.nv').forEach(b=>b.classList.remove('on'));window.scrollTo({top:0,behavior:'smooth'});
 }
 window.openGTPeriod=periodRender;
 const oldMore=RENDER.more;RENDER.more=function(){if(oldMore)oldMore();const el=document.querySelector('#s-more .panel');if(el&&!el.querySelector('.gt-period-links'))el.insertAdjacentHTML('afterbegin',`<div class="gt-period-links" style="padding:0 0 12px"><div class="gt-hero" style="margin-bottom:10px"><h3 style="margin:0 0 5px">📊 Raporty treningowe</h3><p class="gt-muted">Szczegółowe statystyki tygodnia i miesiąca</p><div class="row2" style="margin-top:12px"><button class="btn plan" onclick="openGTPeriod('week')">Ten tydzień</button><button class="btn plan" onclick="openGTPeriod('month')">Ten miesiąc</button></div></div></div>`);};
})();
</script>

<script id="gt-v15-extra">
(()=>{
const skins=[
 ['violet','Violet Neon','🟣'],['redblack','Red Black','🔴'],['ocean','Ocean Blue','🌊'],
 ['mint','Mint Fresh','🍃'],['graphite','Graphite','⚫'],['amber','Amber Gold','🟠'],
 ['cyber','Cyber Neon','💠'],['forest','Forest','🌲'],['rose','Rose','🌸'],['ice','Arctic Ice','🧊']
];
const oldSettings=RENDER.settings;
RENDER.settings=function(){
 oldSettings();
 const host=document.querySelector('#s-settings'); if(!host||host.querySelector('.gt-skin-picker'))return;
 const card=document.createElement('div');card.className='panel gt-skin-picker';card.style.cssText='padding:16px;margin-top:12px';
 card.innerHTML='<h2 style="margin:0 0 5px">🎨 Wygląd aplikacji</h2><p class="muted" style="margin:0 0 12px">Wybierz kolor i tryb. Tekst automatycznie dopasuje się do jasnego lub ciemnego tła.</p><div class="gt-skin-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" data-mode="dark">🌙 Ciemny</button><button class="btn ghost" data-mode="light">☀️ Jasny</button><button class="btn ghost" data-mode="auto">⚙️ Auto</button></div>';
 const grid=card.querySelector('.gt-skin-grid');
 grid.innerHTML=skins.map(([id,label,emoji])=>`<button type="button" data-skin-pick="${id}" class="btn ghost" style="text-align:left;min-height:48px">${emoji} ${label}</button>`).join('');
 grid.querySelectorAll('[data-skin-pick]').forEach(b=>b.onclick=()=>{S.settings.skin=b.dataset.skinPick;save();applyTheme();grid.querySelectorAll('button').forEach(x=>x.style.outline=x===b?'2px solid var(--accent)':'none');toast('Motyw zmieniony','check');});
 card.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.mode;save();applyTheme();toast('Tryb wyświetlania zmieniony','check');});
 host.appendChild(card);
};
})();
</script>


<script id="gt-plus-personalization">
(()=>{
 const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
 const cfg=()=>{S.settings=S.settings||{};return S.settings};
 const put=(k,v)=>{cfg()[k]=v;save();applyPlus();};
 function applyPlus(){const c=cfg(),b=document.body;
  b.classList.toggle('gt-no-motion',c.plusMotion==='off');b.classList.toggle('gt-smooth',c.plusMotion!=='off');
  b.classList.remove('gt-font-small','gt-font-normal','gt-font-large');b.classList.add('gt-font-'+(c.plusFont||'normal'));
  b.classList.remove('gt-radius-soft','gt-radius-square');if(c.plusRadius==='soft')b.classList.add('gt-radius-soft');if(c.plusRadius==='square')b.classList.add('gt-radius-square');

  if(c.plusAccent){document.documentElement.style.setProperty('--acc',c.plusAccent);document.documentElement.style.setProperty('--accent',c.plusAccent)}
 }
 const accent=[['#A78BFA','Fiolet'],['#22D3EE','Turkus'],['#34D399','Zieleń'],['#FB7185','Róż'],['#FBBF24','Złoto'],['#60A5FA','Błękit'],['#F97316','Pomarańcz']];
 const wrap=(label,desc,items,key)=>`<div style="margin-top:15px"><label class="fld">${label}</label><p class="muted" style="font-size:12px;margin:4px 0 9px">${desc}</p><div class="gt-plus-grid">${items.map(([v,t,d])=>`<button class="gt-plus-choice ${(cfg()[key]||items[0][0])===v?'active':''}" data-plus-key="${key}" data-plus-value="${v}"><b>${t}</b>${d?`<small style="display:block;color:var(--muted);margin-top:4px">${d}</small>`:''}</button>`).join('')}</div></div>`;
 const oldSettings=RENDER.settings;
 RENDER.settings=function(){oldSettings();const host=$('#s-settings');if(!host||host.querySelector('#gt-plus-settings'))return;
 const card=document.createElement('section');card.id='gt-plus-settings';card.className='gt-plus-card';
 card.innerHTML=`<h2 style="margin:0 0 5px">✨ Personalizacja Plus</h2><p class="muted" style="font-size:13px;margin:0">Dostosuj aplikację do swojego telefonu i stylu.</p>
 ${wrap('Rozmiar tekstu','Ustaw czytelność interfejsu.',[['small','Mały','Więcej informacji'],['normal','Normalny','Ustawienie standardowe'],['large','Duży','Łatwiejsze czytanie']],'plusFont')}
 ${wrap('Kształt kart','Zmień wygląd paneli i przycisków.',[['default','Standard','Zaokrąglone karty'],['soft','Miękki','Mocniej zaokrąglone'],['square','Prosty','Mniejsze zaokrąglenia']],'plusRadius')}
 ${wrap('Animacje','Wybierz styl przejść.',[['full','Płynne','Animacje i przejścia'],['quick','Szybkie','Krótsze animacje'],['off','Wyłączone','Mniej ruchu']],'plusMotion')}
 <div style="margin-top:15px"><label class="fld">Kolor akcentu</label><div class="gt-plus-grid">${accent.map(([v,t])=>`<button class="gt-plus-choice ${(cfg().plusAccent||'')===v?'active':''}" data-plus-key="plusAccent" data-plus-value="${v}"><span style="display:inline-block;width:15px;height:15px;border-radius:50%;background:${v};vertical-align:middle;margin-right:7px"></span>${t}</button>`).join('')}</div></div>
 <div style="margin-top:15px"><label class="fld">Szybkość animacji</label><input class="gt-range" id="gt-plus-speed" type="range" min="120" max="600" step="40" value="${cfg().plusSpeed||280}"><div class="muted" id="gt-plus-speed-label" style="font-size:12px">${cfg().plusSpeed||280} ms</div></div>
 <button class="btn ghost block" id="gt-plus-reset" style="margin-top:14px">Przywróć domyślny wygląd</button>`;
 host.appendChild(card);
 card.querySelectorAll('[data-plus-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.plusKey,v=b.dataset.plusValue;if(k==='plusMotion')put(k,v);else put(k,v);card.querySelectorAll(`[data-plus-key="${k}"]`).forEach(x=>x.classList.toggle('active',x===b));toast('Wygląd zaktualizowany','check');});
 const range=$('#gt-plus-speed');range.oninput=()=>{cfg().plusSpeed=+range.value;$('#gt-plus-speed-label').textContent=range.value+' ms';applyPlus();save()};
 $('#gt-plus-reset').onclick=()=>{['plusFont','plusRadius','plusMotion','plusAccent','plusSpeed'].forEach(k=>delete cfg()[k]);save();applyPlus();RENDER.settings();toast('Przywrócono domyślny wygląd','check')};
 };
 // Dodatkowe analizy liczone wyłącznie z zapisanej historii, bez fikcyjnych danych.
 function plusAnalytics(){const hist=(S.history||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));if(!hist.length)return '<p class="muted">Zapisz pierwszy trening, aby zobaczyć dodatkowe analizy.</p>';
  const volume=h=>(h.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).filter(x=>x.done&&x.type!=='w').reduce((z,x)=>z+(+x.weight||0)*(+x.reps||0),0),0);
  const now=new Date(),month=now.toISOString().slice(0,7),weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);
  const wk=hist.filter(h=>new Date(h.date)>=weekStart),mo=hist.filter(h=>String(h.date).slice(0,7)===month),prev=hist.filter(h=>{const d=new Date(h.date);return d.getMonth()===now.getMonth()-1&&d.getFullYear()===(now.getMonth()===0?now.getFullYear()-1:now.getFullYear())});
  const total=hist.reduce((n,h)=>n+volume(h),0),wv=wk.reduce((n,h)=>n+volume(h),0),mv=mo.reduce((n,h)=>n+volume(h),0),pv=prev.reduce((n,h)=>n+volume(h),0);
  const fmt=n=>Math.round(n).toLocaleString('pl-PL'),delta=(a,b)=>b?`${a>=b?'+':''}${Math.round((a-b)/b*100)}%`:'brak danych';
  const last=hist.slice(-12),series=last.map(h=>volume(h)),max=Math.max(1,...series),min=Math.min(...series),pts=series.map((v,i)=>`${18+i*(264/Math.max(1,series.length-1))},${94-(v/max)*70}`).join(' ');
  const chart=`<svg class="gt-plus-chart" viewBox="0 0 300 110" role="img" aria-label="Tonaż ostatnich treningów"><line x1="15" y1="95" x2="285" y2="95" stroke="currentColor" opacity=".18"/><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${series.map((v,i)=>`<circle cx="${18+i*(264/Math.max(1,series.length-1))}" cy="${94-(v/max)*70}" r="3" fill="var(--acc)"/>`).join('')}</svg>`;
  return `<div class="gt-plus-statgrid"><div class="gt-plus-stat"><b>${fmt(total)} kg</b><span>Łączny tonaż</span></div><div class="gt-plus-stat"><b>${hist.length}</b><span>Wszystkie treningi</span></div><div class="gt-plus-stat"><b>${fmt(wv)} kg</b><span>Tonaż w tym tygodniu</span></div><div class="gt-plus-stat"><b>${fmt(mv)} kg</b><span>Tonaż w tym miesiącu</span></div></div><div style="margin-top:16px"><b>Trend ostatnich 12 treningów</b>${chart}<div class="muted" style="font-size:12px">Wykres pokazuje łączny tonaż serii roboczych w kolejnych zapisanych treningach.</div></div><div style="margin-top:14px"><div class="gt-plus-row"><span>Średni tonaż na trening</span><b>${fmt(total/hist.length)} kg</b></div><div class="gt-plus-row"><span>Treningi w tym tygodniu</span><b>${wk.length}</b></div><div class="gt-plus-row"><span>Zmiana tonażu miesiąc do miesiąca</span><b>${delta(mv,pv)}</b></div><div class="gt-plus-row"><span>Największy tonaż pojedynczego treningu</span><b>${fmt(Math.max(...hist.map(volume)))} kg</b></div></div>`;
 }
 const oldCharts=RENDER.charts;
 RENDER.charts=function(){oldCharts();const host=$('#s-charts');if(!host||host.querySelector('#gt-plus-analytics'))return;const card=document.createElement('section');card.id='gt-plus-analytics';card.className='gt-plus-card';card.innerHTML='<h2 style="margin:0 0 5px">📊 Dodatkowe statystyki</h2><p class="muted" style="font-size:13px;margin:0">Podsumowanie oparte na zapisanych treningach.</p>'+plusAnalytics();host.appendChild(card);};
 // Rozbudowane podsumowanie każdego treningu: najlepsze ćwiczenia, tempo i porównanie.
 const baseSummary=window.g_summaryHTML;
 if(typeof baseSummary==='function')window.g_summaryHTML=function(session,isNew,badges){
  const base=baseSummary(session,isNew,badges),ex=(session.exercises||[]).map(e=>({name:e.name,sets:(e.sets||[]).filter(x=>x.done&&x.type!=='w'),muscle:e.muscle||'Inne'})).map(e=>({...e,vol:e.sets.reduce((n,x)=>n+(+x.weight||0)*(+x.reps||0),0),best:e.sets.reduce((m,x)=>Math.max(m,+x.weight||0),0)})).filter(e=>e.sets.length).sort((a,b)=>b.vol-a.vol);
  const fmt=n=>Math.round(n).toLocaleString('pl-PL');
  const top=ex.slice(0,3).map((e,i)=>`<div class="gt-plus-row"><span>${i+1}. ${String(e.name).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}</span><b>${fmt(e.vol)} kg</b></div>`).join('')||'<p class="muted">Brak zapisanych serii roboczych.</p>';
  const sets=ex.reduce((n,e)=>n+e.sets.length,0),reps=ex.reduce((n,e)=>n+e.sets.reduce((a,x)=>a+(+x.reps||0),0),0),vol=ex.reduce((n,e)=>n+e.vol,0),avg=sets?vol/sets:0;
  const muscles={};ex.forEach(e=>muscles[e.muscle]=(muscles[e.muscle]||0)+e.sets.length);const groups=Object.entries(muscles).sort((a,b)=>b[1]-a[1]);
  const detail=`<section class="gt-plus-card"><h2 style="margin:0 0 5px">📈 Szczegółowa analiza treningu</h2><p class="muted" style="font-size:12px;margin:0">Dodatkowe dane wyliczone z zapisanych serii.</p><div class="gt-plus-statgrid"><div class="gt-plus-stat"><b>${fmt(avg)} kg</b><span>Średni tonaż na serię</span></div><div class="gt-plus-stat"><b>${reps}</b><span>Łączna liczba powtórzeń</span></div><div class="gt-plus-stat"><b>${sets}</b><span>Serie robocze</span></div><div class="gt-plus-stat"><b>${groups.length}</b><span>Zaangażowane partie</span></div></div><h3 style="margin:16px 0 4px">Największa objętość</h3>${top}<h3 style="margin:16px 0 4px">Rozkład serii</h3>${groups.map(([m,n])=>`<div class="gt-plus-row"><span>${m}</span><b>${n} serii · ${sets?Math.round(n/sets*100):0}%</b></div>`).join('')||'<p class="muted">Brak danych o partiach mięśniowych.</p>'}</section>`;
  return base.replace('<div class="gs-bar',detail+'<div class="gs-bar');
 };
 // Rozszerzony raport miesiąca o tempo i średnie wyniki.
 const baseReport=RENDER.report;
 RENDER.report=function(){baseReport();const host=$('#s-report');if(!host||host.querySelector('#gt-plus-month'))return;const hist=(S.history||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))),now=new Date(),key=now.toISOString().slice(0,7),prevDate=new Date(now.getFullYear(),now.getMonth()-1,1),prevKey=prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0');
  const vol=h=>(h.exercises||[]).reduce((n,e)=>n+(e.sets||[]).filter(x=>x.done&&x.type!=='w').reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0),0),cur=hist.filter(h=>String(h.date).slice(0,7)===key),old=hist.filter(h=>String(h.date).slice(0,7)===prevKey),total=cur.reduce((n,h)=>n+vol(h),0),prior=old.reduce((n,h)=>n+vol(h),0),days=new Set(cur.map(h=>h.date)).size,average=cur.length?Math.round(total/cur.length):0,delta=prior?Math.round((total-prior)/prior*100):null;
  const card=document.createElement('section');card.id='gt-plus-month';card.className='gt-plus-card';card.innerHTML=`<h2 style="margin:0 0 5px">🗓️ Rozszerzone podsumowanie miesiąca</h2><p class="muted" style="font-size:12px;margin:0">Na podstawie treningów zapisanych w tym miesiącu.</p><div class="gt-plus-statgrid"><div class="gt-plus-stat"><b>${cur.length}</b><span>Treningi</span></div><div class="gt-plus-stat"><b>${days}</b><span>Dni z treningiem</span></div><div class="gt-plus-stat"><b>${Math.round(total).toLocaleString('pl-PL')} kg</b><span>Łączny tonaż</span></div><div class="gt-plus-stat"><b>${average.toLocaleString('pl-PL')} kg</b><span>Średnio na trening</span></div></div><div class="gt-plus-row"><span>Poprzedni miesiąc</span><b>${Math.round(prior).toLocaleString('pl-PL')} kg</b></div><div class="gt-plus-row"><span>Zmiana tonażu</span><b>${delta===null?'Brak danych':(delta>0?'+':'')+delta+'%'}</b></div><div class="gt-plus-row"><span>Średnia liczba treningów na tydzień</span><b>${(cur.length/Math.max(1,Math.ceil(now.getDate()/7))).toFixed(1).replace('.',',')}</b></div>`;host.appendChild(card);
 };
 applyPlus();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyPlus()});
})();
</script>
