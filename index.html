<!DOCTYPE html>
<html lang="pl" data-theme="dark" data-skin="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="mobile-web-app-capable" content="yes">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: guma na podłodze, talerze olimpijskie ===== */
:root{
  --floor:#1a1c1b; --steel:#232625; --steel2:#2d312f; --line:#3a3f3c;
  --chalk:#ece9e1; --dust:#a2a59e; --faint:#71756f; --on-chalk:#161817;
  --red:#e8503a; --blue:#4a8df0; --green:#34b872; --yellow:#f3c231; --plate-white:#f2f1ec;
  --bad:#ef5a45; --ok:#34b872;
  --disp:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:62px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --floor:#dcdfdb; --steel:#eceeeb; --steel2:#cfd3cf; --line:#b5bbb6;
  --chalk:#161817; --dust:#4d514c; --faint:#7a7e78; --on-chalk:#eceeeb;
  --red:#d03a25; --blue:#2467d1; --green:#1b8a52; --yellow:#d4a20c; --plate-white:#ffffff;
  --bad:#c92f1b; --ok:#1b8a52;
  color-scheme:light;
}
.p-push{--plan:var(--red);--ink:#fff}
.p-pull{--plan:var(--blue);--ink:#fff}
.p-upper_legs{--plan:var(--green);--ink:#0c2015}
.p-upper{--plan:var(--yellow);--ink:#1d1700}
.p-none{--plan:var(--dust);--ink:var(--floor)}
:root[data-theme="light"] .p-upper_legs{--ink:#fff}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--floor);color:var(--chalk);font:500 15px/1.45 var(--body);min-height:100dvh;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--disp)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--dust)}
.faint{color:var(--faint)}
.hidden{display:none!important}

/* ===== Shell ===== */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--floor) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top-in{max-width:520px;margin:0 auto;padding-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--disp);letter-spacing:.05em;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  font:700 13px var(--body);background:var(--steel)}
.pill .ic{color:var(--yellow)}
.app{max-width:520px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.screen{animation:none}
nav.tabs{margin:6px -16px 0;padding:0 8px;border-top:1px solid var(--line)}
nav.tabs .navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nv{position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:11px;font-weight:700;min-width:0}
.nv .ic{width:22px;height:22px}
.nv.on{color:var(--chalk)}
.nv.on::after{content:"";position:absolute;bottom:0;left:50%;width:30px;height:3px;margin-left:-15px;background:var(--chalk);border-radius:3px 3px 0 0}
.nv .badge-dot{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--floor)}

/* ===== Type + sections ===== */
.h-xl{font:800 40px/.98 var(--disp);letter-spacing:.01em}
.h-lg{font:700 30px/1 var(--disp)}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font:700 24px/1.1 var(--disp);letter-spacing:.02em}
.sec-h .sub{font-size:13px;color:var(--dust);font-weight:600}
.sub-link{font-size:13px;font-weight:700;color:var(--dust);display:inline-flex;align-items:center;gap:2px}
.back{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--dust);margin:-4px 0 12px -4px;padding:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 0;font-size:13px;color:var(--dust);font-weight:600}
.meta span+span{border-left:1px solid var(--line);margin-left:10px;padding-left:10px}
.empty{padding:22px 12px;text-align:center;color:var(--dust);font-size:14px;border:1px dashed var(--line);border-radius:16px}

/* ===== Surfaces ===== */
.panel{background:var(--steel);border:1px solid var(--line);border-radius:20px;padding:16px}
.panel + .panel{margin-top:12px}
.hero{position:relative;background:var(--steel);border:1px solid color-mix(in srgb,var(--plan,var(--line)) 55%,var(--line));border-radius:26px;padding:18px}
.hero-top{display:flex;gap:16px;align-items:center}
.hero-top .plate{flex:none}
.plate text{font:800 21px var(--disp);letter-spacing:.04em}
.hero .meta{margin-top:8px}
.hero .btn{margin-top:16px}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;border-radius:16px;
  background:var(--plan);color:var(--ink);margin-bottom:14px;font-weight:800}
.resume .num{font-size:24px}
.note-row{margin-top:12px;font-size:13px;color:var(--dust);display:flex;gap:8px;align-items:flex-start}
.note-row .ic{margin-top:2px}

/* ===== Buttons / inputs ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  background:var(--chalk);color:var(--on-chalk);font-weight:800;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:0 14px;border-radius:11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.plan{background:var(--plan);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.btn.dangerfill{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--dust)}
.icon-btn.box{border:1px solid var(--line);background:var(--steel)}
.in{width:100%;min-height:46px;background:var(--floor);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;color:var(--chalk)}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.4}
.in:focus{border-color:var(--chalk);outline:none}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dust) 50%),linear-gradient(135deg,var(--dust) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
label.fld{display:block;font-size:13px;font-weight:700;color:var(--dust);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack>*+*{margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.seg{display:flex;gap:2px;background:var(--floor);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-weight:700;font-size:13px;color:var(--dust);padding:0 6px}
.seg button.on{background:var(--chalk);color:var(--on-chalk)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dust);white-space:nowrap}
.chip.plan{background:color-mix(in srgb,var(--plan) 20%,transparent);border-color:color-mix(in srgb,var(--plan) 50%,transparent);color:var(--chalk)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{min-height:34px;padding:0 14px;font-size:13px}
.chips .chip.on{background:var(--chalk);color:var(--on-chalk);border-color:var(--chalk)}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--steel2);border:1px solid var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dust);transition:transform .15s,background .15s}
.switch.on{background:var(--chalk)}
.switch.on::after{transform:translateX(20px);background:var(--on-chalk)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt b{display:block;font-weight:700}
.opt small{color:var(--dust);font-size:12.5px}

/* ===== Lists ===== */
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:800;font-size:16px}
.li .s{font-size:13px;color:var(--dust);font-weight:600}
.li .chev{color:var(--faint)}
.mini-plate{width:46px;height:46px;border-radius:50%;background:var(--plan);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;
  font:800 17px var(--disp);letter-spacing:.03em;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--ink) 0%,transparent),inset 0 0 0 5px color-mix(in srgb,var(--ink) 22%,transparent)}
.mini-plate.sm{width:34px;height:34px;font-size:13px}
.mini-plate.ring{background:transparent;color:var(--plan);box-shadow:inset 0 0 0 2.5px var(--plan)}

/* ===== Week strip ===== */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd small{display:block;font-size:11.5px;font-weight:700;color:var(--dust);margin-bottom:6px}
.wd .c{margin:0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--faint)}
.wd .c.plan{border:2.5px solid var(--plan);border-style:solid;color:var(--plan)}
.wd .c.done{background:var(--plan);border-color:var(--plan);color:var(--ink)}
.wd.today small{color:var(--chalk)}
.wd.today .c{box-shadow:0 0 0 2px var(--floor),0 0 0 4px var(--chalk)}

/* ===== Tiles ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--steel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:116px}
.tile .k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--dust)}
.tile .v{font:700 26px/1 var(--disp);letter-spacing:.01em}
.tile .v small{font:600 13px var(--body);color:var(--dust)}
.tile .bar{margin-top:auto}
.tile .act{margin-top:auto;align-self:flex-start}
.bar{height:8px;border-radius:4px;background:var(--steel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--chalk);border-radius:4px;transition:width .3s}
.bar.plan>i{background:var(--plan)}
.bar.blue>i{background:var(--blue)}
.xp{height:5px;margin-top:8px}

/* ===== Workout ===== */
.wh{position:relative;background:var(--steel);border:1px solid color-mix(in srgb,var(--plan) 55%,var(--line));border-radius:22px;padding:16px}
.wh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wh h2{font:800 30px/1 var(--disp)}
.wh .sub{color:var(--dust);font-weight:600;font-size:13px;margin-top:4px}
.clock{font:800 34px/1 var(--disp);letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:right}
.clock small{display:block;font:600 12px var(--body);color:var(--dust);margin-top:4px;letter-spacing:0}
.wh .bar{margin:14px 0 8px}
.wh-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--dust);font-weight:700}
.wh-tools{display:flex;gap:8px;margin-top:14px}
.ex{background:var(--steel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.ex.complete{border-color:color-mix(in srgb,var(--plan) 60%,var(--line))}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-h .grow{flex:1;min-width:0}
.ex-h h3{font-weight:800;font-size:16.5px;line-height:1.25}
.ex-h .tgt{font:700 15px var(--disp);padding:3px 9px;border-radius:8px;background:var(--steel2);white-space:nowrap}
.ex-last{font-size:12.5px;color:var(--dust);margin-top:6px;font-weight:600}
.ex-note{font-size:12.5px;color:var(--dust);margin-top:6px;display:flex;gap:6px}
.sugg{margin-top:8px;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--plan) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--plan) 45%,transparent);font-size:13px;font-weight:700}
.sets{margin-top:12px}
.setgrid{display:grid;grid-template-columns:36px minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.setgrid.hd{font-size:11.5px;font-weight:700;color:var(--faint);text-align:center;margin-bottom:4px}
.set{margin-top:8px}
.set-idx{height:36px;border-radius:10px;background:var(--steel2);font:700 16px var(--disp);color:var(--chalk)}
.set-idx.w{background:transparent;border:1.5px dashed var(--faint);color:var(--dust)}
.set-idx.d{background:color-mix(in srgb,var(--plan) 25%,transparent);border:1.5px solid var(--plan)}
.set-prev{font:600 14px var(--disp);color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.set .in{min-height:46px;padding:0 4px;text-align:center;font:700 21px var(--disp);letter-spacing:.01em}
.set-check{height:46px;border-radius:12px;border:1.5px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;transition:background .12s}
.set-check .ic{width:22px;height:22px}
.set.done .set-check{background:var(--plan);border-color:var(--plan);color:var(--ink)}
.set.done .in{color:var(--dust)}
.set .prb{grid-column:2 / 5;font-size:12px;font-weight:800;color:var(--yellow);display:flex;align-items:center;gap:6px}
.ex-foot{display:flex;gap:8px;margin-top:10px}
.ex-foot .btn{flex:1}

/* ===== Rest dock ===== */
.dock{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:40;max-width:496px;margin:0 auto;
  background:var(--chalk);color:var(--on-chalk);border-radius:20px;padding:10px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dock .ring{position:relative;width:56px;height:56px;flex:none}
.dock .ring svg{transform:rotate(-90deg)}
.dock .ring .ic{position:absolute;inset:0;margin:auto;width:20px;height:20px}
.dock .tm{font:800 32px/1 var(--disp);font-variant-numeric:tabular-nums}
.dock .lb{font-size:12px;font-weight:700;opacity:.65}
.dock .grow{flex:1;min-width:0}
.dock .acts{display:flex;gap:5px;flex:none}
.dock .acts button{height:40px;min-width:40px;padding:0 9px;border-radius:12px;background:color-mix(in srgb,var(--on-chalk) 12%,transparent);font-weight:800;font-size:13px}
.dock .acts button.skip{background:var(--on-chalk);color:var(--chalk)}

/* ===== Sheet / toast ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:520px;margin:0 auto;background:var(--steel);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  max-height:90dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sh-t{font:800 28px/1.05 var(--disp);margin-bottom:6px}
.sh-list .li{padding:14px 0}
.sh-list .li .ic{color:var(--dust)}
.sh-list .li.bad{color:var(--bad)}
.sh-list .li.bad .ic{color:var(--bad)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translate(-50%,-20px);z-index:70;opacity:0;pointer-events:none;
  background:var(--chalk);color:var(--on-chalk);font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;max-width:min(92vw,440px);
  display:flex;align-items:center;gap:10px;transition:opacity .2s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.pr{background:var(--yellow);color:#1d1700;font-size:15px}
.toast.pr .ic{width:26px;height:26px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ===== Calendar ===== */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h h2{font:800 28px var(--disp);letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dn{text-align:center;font-size:12px;font-weight:700;color:var(--dust);padding-bottom:4px}
.cd{aspect-ratio:1/1.08;border-radius:12px;background:var(--steel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:700;font-size:14px;position:relative}
.cd.empty0{background:transparent}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--dust)}
.cd.sel{outline:2px solid var(--chalk);outline-offset:1px}
.dots{display:flex;gap:3px;height:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--plan)}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--plan)}
.sess{padding:14px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0;padding-top:0}
.sess-h{display:flex;align-items:center;gap:12px}
.sx{margin-top:10px;font-size:13.5px}
.sx .n{font-weight:800}
.sx .sv{color:var(--dust);font-weight:600;font-variant-numeric:tabular-nums}
.sx + .sx{margin-top:6px}

/* ===== Charts / bars ===== */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat3>div{padding:0 12px;border-left:1px solid var(--line)}
.stat3>div:first-child{padding-left:0;border-left:0}
.stat3 b{display:block;font:800 34px/1 var(--disp)}
.stat3 small{font-size:12.5px;color:var(--dust);font-weight:600}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font:600 10.5px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--steel2)}
.chart .b.cur{fill:var(--chalk)}
.chart .ln{fill:none;stroke:var(--chalk);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--floor);stroke:var(--chalk);stroke-width:2}
.chart .bv{fill:var(--chalk);font-weight:800}

const MONTHS = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
const MONTHS_GEN = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const MONTH_SHORT = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
function niceDate(s) { const d = parseYmd(s); return `${DAY_SHORT[d.getDay()]}, ${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`; }
function longDate(s) { const d = parseYmd(s); return `${DAY_PL[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }
function ago(s) {
    const n = dayDiff(todayStr(), s);
    if (n <= 0) return 'dziś';
    if (n === 1) return 'wczoraj';
    return `${n} dni temu`;
}
function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
}

function planParts(key) {
    const t = PRESET_PLANS[key].title.replace(/^[^\p{L}]+/u, '');
    const m = t.match(/^(.*?)\s*\((.*)\)\s*$/);
    return m ? { short: m[1], sub: m[2] } : { short: t, sub: '' };
}
const planKeyFromTitle = t => PLAN_ORDER.find(k => PRESET_PLANS[k].title === t) || null;
const planCls = k => 'p-' + (k && PRESET_PLANS[k] ? k : 'none');
const dayAbbr = k => k ? DAY_SHORT[parseYmd(todayStr()).getDay() && 0] : '';
const PLAN_DAY_ABBR = { push: 'PN', pull: 'ŚR', upper_legs: 'PT', upper: 'SO' };
const planExercises = k => (S && S.planOverrides && S.planOverrides[k]) || PRESET_PLANS[k].exercises;
const planSets = k => planExercises(k).reduce((a, e) => a + (parseInt(e.target) || 3), 0);

/* ---------- Matematyka siłowa ---------- */
const e1rm = (w, r) => (!w || !r || r < 1) ? 0 : (r === 1 ? w : w * (1 + r / 30));

function parseTarget(t) {
    const m = String(t || '').match(/(\d+)\s*[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
    if (!m) return { sets: 3, min: 8, max: 12 };
    return { sets: +m[1], min: +m[2], max: +(m[3] || m[2]) };
}

function migrate(raw) {
    const d = defaultState();
    if (!raw || typeof raw !== 'object') return d;
    const s = Object.assign(d, raw);
    s.user = Object.assign(defaultState().user, raw.user || {});
    s.settings = Object.assign(defaultSettings(), raw.settings || {});
    if (!Array.isArray(s.settings.plates) || !s.settings.plates.length) s.settings.plates = defaultSettings().plates;
    if (!Array.isArray(s.settings.customExercises)) s.settings.customExercises = [];
    s.history = Array.isArray(raw.history) ? raw.history : [];
    s.prs = (raw.prs && typeof raw.prs === 'object') ? raw.prs : {};
    s.habitLog = (raw.habitLog && typeof raw.habitLog === 'object') ? raw.habitLog : {};
    s.bodyweight = Array.isArray(raw.bodyweight) ? raw.bodyweight : [];
    s.planOverrides = (raw.planOverrides && typeof raw.planOverrides === 'object') ? raw.planOverrides : {};
    s.goals = Array.isArray(raw.goals) ? raw.goals : [];
    s.readiness = (raw.readiness && typeof raw.readiness === 'object') ? raw.readiness : {};
    // stary format nawyków (jeden dzień)
    if (raw.habits && raw.habits.date && !s.habitLog[raw.habits.date]) {
        const h = raw.habits;
        s.habitLog[h.date] = { water: h.water || 0, creatine: !!h.creatine, creatineTime: h.creatineTime || null, protein: 0, waterAdds: [], proteinAdds: [], xp: {} };
    }
    delete s.habits;
    s.history.forEach((h, i) => {
        h.id = h.id || (Date.now() + i);
        h.planKey = h.planKey || planKeyFromTitle(h.title);
        h.exercises = Array.isArray(h.exercises) ? h.exercises : [];
        h.exercises.forEach(e => { e.sets = Array.isArray(e.sets) ? e.sets : []; });
    });
    s.history.sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.id - a.id));
    Object.keys(s.prs).forEach(k => {
        const p = s.prs[k];
        p.e1rm = p.e1rm || e1rm(p.weight, p.reps);
        p.maxW = p.maxW || p.weight;
    });
    s.stats = Object.assign({ prCount: Object.keys(s.prs).length, bestStreak: 0 }, raw.stats || {});

    return s;
}

function H(date) {

/* ---------- Statystyki z historii ---------- */
const sessionsOn = date => S.history.filter(h => h.date === date);
function weekSessions(monday) {
    const a = ymd(monday), b = ymd(addDays(monday, 6));
    return S.history.filter(h => h.date >= a && h.date <= b);
}
function weeklyStreak() {
    const goal = Math.max(1, S.settings.weeklyGoal);
    let m = mondayOf(new Date()), streak = 0;
    if (weekSessions(m).length >= goal) streak++;
    m = addDays(m, -7);
    while (streak < 600 && weekSessions(m).length >= goal) { streak++; m = addDays(m, -7); }
    return streak;
}
const workSets = ex => ex.sets.filter(s => s.done && s.type !== 'w');
function sessionVolume(h) { return h.volume != null ? h.volume : h.exercises.reduce((a, e) => a + workSets(e).reduce((b, s) => b + s.weight * s.reps, 0), 0); }
function prevSets(name) {
    for (const h of S.history) {
        const e = h.exercises.find(x => x.name === name);
        if (e) { const ws = workSets(e).filter(s => s.weight > 0 || s.reps > 0); if (ws.length) return ws; }
    }
    return [];
}
function lastSessionOf(planKey) { return S.history.find(h => h.planKey === planKey) || null; }
function rebuildPRs() {
    const prs = {};
    [...S.history].reverse().forEach(h => h.exercises.forEach(e => workSets(e).forEach(s => {
        if (!s.weight || !s.reps) return;
        const est = e1rm(s.weight, s.reps), cur = prs[e.name];
        if (!cur) { prs[e.name] = { weight: s.weight, reps: s.reps, e1rm: est, maxW: s.weight, date: h.date }; return; }
        if (est > cur.e1rm) { cur.weight = s.weight; cur.reps = s.reps; cur.e1rm = est; cur.date = h.date; }
        if (s.weight > cur.maxW) cur.maxW = s.weight;
    })));
    S.prs = prs;
}

/* ---------- Dźwięk, wibracje, konfetti ---------- */
let audioCtx = null;
function chime(freqs = [587.33, 880]) {
    if (!S || !S.settings.sound) return;
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audioCtx.currentTime;
        freqs.forEach((f, i) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0 + i * 0.16);
            g.gain.exponentialRampToValueAtTime(0.28, t0 + i * 0.16 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.16 + 0.42);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 0.45);
        });
    } catch (e) { /* audio niedostępne */ }
}
function buzz(p) { try { if (S.settings.vibrate && navigator.vibrate) navigator.vibrate(p); } catch (e) { } }
function confetti(n = 90) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti'), ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const cols = ['#e8503a', '#4a8df0', '#34b872', '#f3c231', '#f2f1ec'];
    const ps = Array.from({ length: n }, () => ({
        x: innerWidth / 2, y: innerHeight * 0.55, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4,
        w: Math.random() * 8 + 5, h: Math.random() * 4 + 3, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4
    }));
    let f = 0;
    (function tick() {
        ctx.clearRect(0, 0, c.width, c.height);
        ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
        if (++f < 120) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
    })();
}

const rest = { end: 0, total: 0, iv: null };

    $('#dock-time').textContent = fmtClock(left);
    const frac = clamp(1 - (rest.end - Date.now()) / (rest.total * 1000), 0, 1);

}

}

function barChart(vals, labels, curIdx) {
    const W = 320, H = 150, B = 22, T = 18, n = vals.length, gap = 8, bw = (W - gap * (n - 1)) / n, max = Math.max(...vals, 1);
    let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres słupkowy">`;
    out += `<line class="gl" x1="0" y1="${H - B}" x2="${W}" y2="${H - B}"/>`;
    vals.forEach((v, i) => {
        const h = Math.max(v > 0 ? 3 : 0, (H - B - T) * v / max), x = i * (bw + gap);
        out += `<rect class="b ${i === curIdx ? 'cur' : ''}" x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/>`;
        out += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
        if (v > 0 && (i === curIdx || v === max)) out += `<text class="bv" x="${(x + bw / 2).toFixed(1)}" y="${(H - B - h - 5).toFixed(1)}" text-anchor="middle">${v >= 1000 ? fmt1(v / 1000) + ' t' : fmt(v)}</text>`;
    });
    return out + '</svg>';
}
function lineChart(vals, labels) {
    if (vals.length < 2) return `<div class="empty">Potrzeba co najmniej 2 pomiarów, żeby narysować wykres.</div>`;
    const W = 320, H = 170, L = 38, R = 8, T = 10, B = 22;
    let min = Math.min(...vals), max = Math.max(...vals);
    if (min === max) { min -= 1; max += 1; }
    const p = (max - min) * .15; min -= p; max += p;
    const x = i => L + (W - L - R) * (i / (vals.length - 1)), y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
    let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres liniowy">`;
    [min + p, (min + max) / 2, max - p].forEach(g => { out += `<line class="gl" x1="${L}" y1="${y(g).toFixed(1)}" x2="${W - R}" y2="${y(g).toFixed(1)}"/><text x="${L - 6}" y="${(y(g) + 3.5).toFixed(1)}" text-anchor="end">${fmt1(g)}</text>`; });
    out += `<path class="ln" d="${vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}"/>`;
    vals.forEach((v, i) => { out += `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === vals.length - 1 ? 5 : 3.5}"/>`; });
    const idxs = [0, Math.floor((vals.length - 1) / 2), vals.length - 1].filter((v, i, a) => a.indexOf(v) === i);
    idxs.forEach(i => { out += `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === vals.length - 1 ? 'end' : 'middle'}">${esc(labels[i])}</text>`; });
    return out + '</svg>';
}

function mkExercise(name, target, desc) {
    const pv = prevSets(name), n = parseTarget(target).sets || 3, sets = [];
    for (let i = 0; i < n; i++) {
        const src = pv[i] || pv[pv.length - 1];
        sets.push({ weight: src ? src.weight : 0, reps: src ? src.reps : 0, done: false, type: 'n' });
    }
    return { name, target, desc: desc || '', note: '', muscle: muscleOf(name), sets };
}
async function startWorkout(key) {
    if (S.activeWorkout) {
        const ok = await confirmSheet({ title: 'Zastąpić trwający trening?', text: 'Zaliczone serie z bieżącej sesji zostaną utracone.', ok: 'Zacznij nowy', danger: true });
        if (!ok) return;
    } else closeSheet();
    const plan = PRESET_PLANS[key];
    S.activeWorkout = {
        planKey: key, title: plan.title, category: plan.category, startTime: Date.now(), note: '', prs: [],
        exercises: planExercises(key).map(e => mkExercise(e.name, e.target, e.desc))
    };
    save(); stopRest(false); lockScreen(); go('workout');
}
async function startFreeWorkout() {

    }

    openAddExercise();
}

function suggestion(e) {
    const pv = prevSets(e.name);
    if (!pv.length) return null;
    const tg = parseTarget(e.target), mw = Math.max(...pv.map(s => s.weight));
    if (!mw || pv.length < tg.sets || !pv.every(s => s.reps >= tg.max)) return null;
    const sw = mw + S.settings.step, open = e.sets.find(s => s.type !== 'w' && !s.done);
    if (!open || open.weight >= sw) return null;
    return { weight: sw, reps: tg.min, max: tg.max };
}
function setRow(i, j, s, lbl, pv) {
    return `<div class="set setgrid ${s.done ? 'done' : ''}" id="set-${i}-${j}">
        <button class="set-idx ${s.type === 'w' ? 'w' : s.type === 'd' ? 'd' : ''}" onclick="cycleType(${i},${j})" aria-label="Typ serii. Zmień">${lbl}</button>
        <div class="set-prev">${pv ? `${pv.weight}×${pv.reps}` : '–'}</div>
        <input class="in" type="text" inputmode="decimal" value="${s.weight || ''}" placeholder="kg" onfocus="this.select()" onchange="setField(${i},${j},'weight',this.value)" aria-label="Ciężar w kilogramach">
        <input class="in" type="text" inputmode="numeric" value="${s.reps || ''}" placeholder="powt." onfocus="this.select()" onchange="setField(${i},${j},'reps',this.value)" aria-label="Liczba powtórzeń">
        <button class="set-check" onclick="toggleSet(${i},${j})" aria-label="Zalicz serię">${ic('check')}</button>
        ${s.pr ? `<div class="prb">${ic('trophy')} Nowy rekord</div>` : ''}</div>`;
}
function exerciseCard(e, i) {

        ${pv.length ? `<div class="ex-last">Ostatnio: ${pv.map(s => `${s.weight}×${s.reps}`).join(', ')}</div>` : '<div class="ex-last">Pierwszy raz. Wpisz ciężar, a zapamiętam go na następny trening.</div>'}
        ${e.note ? `<div class="ex-note">${ic('note')}<span>${esc(e.note)}</span></div>` : ''}

}

function renderExercise(i) {
    const e = S.activeWorkout.exercises[i], old = $('#ex-' + i);
    if (old) old.outerHTML = exerciseCard(e, i); else RENDER.workout();
    updateLive();
}
function updateLive() {
    const w = S.activeWorkout; if (!w) return;
    let tot = 0, done = 0, vol = 0;
    w.exercises.forEach(e => e.sets.forEach(s => { if (s.type !== 'w') { tot++; if (s.done) { done++; vol += s.weight * s.reps; } } }));
    const a = $('#w-bar'); if (a) a.style.width = (tot ? done / tot * 100 : 0) + '%';
    const b = $('#w-sets'); if (b) b.textContent = `${done} z ${tot} serii`;
    const c = $('#w-vol'); if (c) c.textContent = `${fmt(vol)} kg`;
    const eta = $('#w-eta'); if (eta) { const left = tot - done; eta.textContent = left ? `ok. ${Math.max(1, Math.round(left * (40 + S.settings.defaultRest) / 60))} min do końca` : 'wszystko zaliczone'; }
}
function setField(i, j, f, v) {
    const w = S.activeWorkout; if (!w) return;
    w.exercises[i].sets[j][f] = Math.max(0, num(v));
    save(); updateLive();
}
function cycleType(i, j) {
    const s = S.activeWorkout.exercises[i].sets[j], order = ['n', 'w', 'd'], names = { n: 'Seria robocza', w: 'Seria rozgrzewkowa (nie liczy się do tonażu)', d: 'Drop set' };
    s.type = order[(order.indexOf(s.type || 'n') + 1) % 3];

}
function toggleSet(i, j) {
    const w = S.activeWorkout; if (!w) return;
    const e = w.exercises[i], s = e.sets[j], row = $('#set-' + i + '-' + j);
    if (row) { const ins = $$('input', row); s.weight = num(ins[0].value); s.reps = num(ins[1].value); }
    if (!s.done) {
        if (!(s.reps > 0)) { toast('Wpisz liczbę powtórzeń', 'info'); return; }
        s.done = true; s.ts = Date.now(); buzz(25);
        let pr = null;
        if (s.type !== 'w') pr = checkPR(e.name, s);
        if (pr === 'pr') {
            s.pr = true; w.prs = w.prs || []; w.prs.push({ name: e.name, weight: s.weight, reps: s.reps });
            addXP(150); confetti(80); chime([784, 988, 1319]); buzz([60, 40, 60]);
            toast(`Rekord: ${e.name}, ${fmt1(s.weight)} kg × ${s.reps}`, 'trophy', 'pr');
        }
        startRest(restFor(e, s));
    } else { s.done = false; s.pr = false; }
    save(); renderExercise(i);
}
function checkPRCore(name, s) {
    if (!s.weight || !s.reps) return null;
    const est = e1rm(s.weight, s.reps), cur = S.prs[name], date = todayStr();
    if (!cur) { S.prs[name] = { weight: s.weight, reps: s.reps, e1rm: est, maxW: s.weight, date }; return 'first'; }
    let pr = false;
    if (est > cur.e1rm + 0.05) { cur.weight = s.weight; cur.reps = s.reps; cur.e1rm = est; cur.date = date; pr = true; }
    if (s.weight > cur.maxW) { cur.maxW = s.weight; pr = true; }
    if (pr) { S.stats.prCount++; return 'pr'; }
    return null;
}
function addSet(i) {
    const e = S.activeWorkout.exercises[i], l = [...e.sets].reverse().find(s => s.type !== 'w') || e.sets[e.sets.length - 1];
    e.sets.push({ weight: l ? l.weight : 0, reps: l ? l.reps : 0, done: false, type: 'n' });
    save(); renderExercise(i);
}
function removeSet(i) {
    const e = S.activeWorkout.exercises[i];
    if (e.sets.length > 1) { e.sets.pop(); save(); renderExercise(i); }
}
function applySuggestion(i) {
    const e = S.activeWorkout.exercises[i], sg = suggestion(e); if (!sg) return;
    e.sets.forEach(s => { if (s.type !== 'w' && !s.done) { s.weight = sg.weight; s.reps = sg.reps; } });
    save(); renderExercise(i); toast(`Ustawiono ${fmt1(sg.weight)} kg`, 'bolt');
}

function warmupRamp(W, bar) {
    const steps = [];
    if (bar > 0 && W >= 60) steps.push([bar, 10]);
    [[.5, 8], [.7, 5], [.85, 3]].forEach(([p, r]) => steps.push([Math.max(bar, round25(W * p)), r]));
    const out = [];
    steps.forEach(([w, r]) => { if (w > 0 && w < W && !out.some(o => o.weight === w)) out.push({ weight: w, reps: r }); });
    return out;
}
function addWarmup(i) {
    const e = S.activeWorkout.exercises[i]; closeSheet();

    const first = e.sets.find(s => s.type !== 'w'), W = first ? first.weight : 0;
    if (W < 30) { toast('Wpisz najpierw ciężar roboczy (min. 30 kg)', 'info'); return; }

    save(); renderExercise(i);
}

}

}

let axList = [];

    EXTRA_EXERCISES.forEach(([n, mu]) => add(n, mu));

/* ---------- Zakończenie / anulowanie ---------- */
async function cancelWorkout() {
    const ok = await confirmSheet({ title: 'Anulować trening?', text: 'Wszystkie wpisane serie z tej sesji zostaną utracone.', ok: 'Anuluj trening', cancel: 'Wróć', danger: true });
    if (ok) discardWorkout();
}
function discardWorkout() {
    S.activeWorkout = null; stopRest(false); unlockScreen(); save(); go('dash');
}
async function finishWorkout() {
    const w = S.activeWorkout; if (!w) return;
    const rowsDone = w.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
    const rowsAll = w.exercises.reduce((a, e) => a + e.sets.length, 0);
    if (!rowsDone) {
        const ok = await confirmSheet({ title: 'Brak zaliczonych serii', text: 'Nie ma czego zapisać. Odrzucić tę sesję?', ok: 'Odrzuć', cancel: 'Wróć', danger: true });
        if (ok) discardWorkout();
        return;
    }
    if (rowsAll - rowsDone > 0) {
        const ok = await confirmSheet({ title: 'Zakończyć trening?', text: `${rowsAll - rowsDone} serii nie zostało zaliczonych i nie trafi do historii.`, ok: 'Zakończ i zapisz', cancel: 'Wróć' });
        if (!ok) return;
    }
    const exercises = w.exercises.map(e => ({
        name: e.name, target: e.target, desc: e.desc, muscle: e.muscle, note: e.note || '',
        sets: e.sets.filter(s => s.done).map(s => ({ weight: s.weight, reps: s.reps, type: s.type || 'n', done: true, pr: !!s.pr }))
    })).filter(e => e.sets.length);
    let volume = 0, completedSets = 0;
    exercises.forEach(e => e.sets.forEach(s => { if (s.type !== 'w') { volume += s.weight * s.reps; completedSets++; } }));
    const prev = w.planKey ? lastSessionOf(w.planKey) : null;
    const session = {
        id: Date.now(), title: w.title, planKey: w.planKey, date: todayStr(),
        duration: Math.max(1, Math.round((Date.now() - w.startTime) / 60000)), volume, completedSets, exercises,
        note: w.note || '', prs: w.prs || [], wellbeing: w.wellbeing || null
    };
    S.history.unshift(session);
    S.history.sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.id - a.id));
    S.activeWorkout = null; stopRest(false); unlockScreen();
    addXP(200); save();
    const newBadges = checkBadges();
    updateChrome();
    showSummary(session, prev, newBadges);
}
function showSummary(s, prev, badges) {

RENDER.calendar = function () {
    if (!calSel) calSel = todayStr();

    const offset = (new Date(y, m, 1).getDay() + 6) % 7, total = new Date(y, m + 1, 0).getDate();

            }).join('');

        <div class="cal">${cells}</div>

        <div class="sec"><div class="sec-h"><h2>Historia</h2><span class="sub">${list.length} sesji</span></div>
        <div class="chips" style="margin-bottom:6px">${chips}</div>
        ${list.length ? `<div>${list.slice(0, histLimit).map(h => `<button class="li ${planCls(h.planKey)}" onclick="selectDay('${h.date}')"><div class="mini-plate sm">${PLAN_DAY_ABBR[h.planKey] || 'WŁ'}</div>

let progView = 'over', progEx = null;
function setProgView(v) { progView = v; RENDER.progress(); window.scrollTo(0, 0); }
function setProgEx(v) { progEx = v; RENDER.progress(); }
const CORE_MUSCLES = ['Klatka', 'Plecy', 'Barki', 'Tył barków', 'Biceps', 'Triceps', 'Nogi', 'Łydki'];

RENDER.progress = function () {
    const tabs = [['over', 'Przegląd'], ['ex', 'Ćwiczenia'], ['pr', 'Rekordy'], ['body', 'Ciało']];
    let body = '';

        <div class="seg">${tabs.map(([k, l]) => `<button class="${progView === k ? 'on' : ''}" onclick="setProgView('${k}')">${l}</button>`).join('')}</div>${body}`;
};
function progOverviewBase() {
    const hist = S.history;
    if (!hist.length) return `<div class="empty" style="margin-top:18px">Statystyki pojawią się po pierwszym zapisanym treningu.</div>`;
    const tv = hist.reduce((a, h) => a + sessionVolume(h), 0), avg = Math.round(hist.reduce((a, h) => a + (h.duration || 0), 0) / hist.length);
    const mon = mondayOf(new Date()), vals = [], labels = [];
    for (let i = 7; i >= 0; i--) {
        const m = addDays(mon, -7 * i);
        vals.push(weekSessions(m).reduce((a, h) => a + sessionVolume(h), 0));
        labels.push(`${m.getDate()}.${String(m.getMonth() + 1).padStart(2, '0')}`);
    }
    const cur = vals[7], prv = vals[6], dl = prv ? Math.round((cur - prv) / prv * 100) : null;
    const since = ymd(addDays(new Date(), -6)), counts = {};
    hist.filter(h => h.date >= since).forEach(h => h.exercises.forEach(e => { const mu = e.muscle || muscleOf(e.name); counts[mu] = (counts[mu] || 0) + workSets(e).length; }));
    const keys = CORE_MUSCLES.concat(Object.keys(counts).filter(k => !CORE_MUSCLES.includes(k) && counts[k] > 0));
    const mx = Math.max(12, ...keys.map(k => counts[k] || 0));
    return `<div class="panel" style="margin-top:18px"><div class="stat3"><div><b>${hist.length}</b><small>treningów</small></div><div><b>${fmt1(tv / 1000)}</b><small>ton łącznie</small></div><div><b>${avg}</b><small>min średnio</small></div></div></div>
        <div class="sec"><div class="sec-h"><h2>Tonaż tygodniowy</h2><span class="sub">${dl === null ? '' : `${dl >= 0 ? '+' : '−'}${Math.abs(dl)}% do zeszłego tygodnia`}</span></div>
        <div class="panel">${barChart(vals, labels, 7)}</div></div>
        <div class="sec"><div class="sec-h"><h2>Serie na partie, 7 dni</h2></div>
        <div class="panel">${keys.map(k => `<div class="mrow"><span>${k}</span><div class="bar"><i style="width:${clamp((counts[k] || 0) / mx * 100, 0, 100)}%"></i></div><span class="v">${counts[k] || 0}</span></div>`).join('')}
        <p class="muted" style="font-size:12.5px;margin-top:14px">Liczone są serie robocze bez rozgrzewki. Często podawany zakres to 10–20 serii tygodniowo na partię.</p></div></div>`;
}
function progExercise() {
    const names = []; S.history.forEach(h => h.exercises.forEach(e => { if (!names.includes(e.name) && workSets(e).length) names.push(e.name); }));
    if (!names.length) return `<div class="empty" style="margin-top:18px">Wykresy ćwiczeń pojawią się po pierwszym zapisanym treningu.</div>`;
    if (!progEx || !names.includes(progEx)) progEx = names[0];
    const pts = [];
    [...S.history].reverse().forEach(h => {
        const e = h.exercises.find(x => x.name === progEx); if (!e) return;
        const ws = workSets(e).filter(s => s.weight > 0 && s.reps > 0); if (!ws.length) return;
        const best = ws.reduce((a, b) => e1rm(b.weight, b.reps) > e1rm(a.weight, a.reps) ? b : a);
        const d = parseYmd(h.date);
        pts.push({ date: h.date, label: `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`, e: e1rm(best.weight, best.reps), best, vol: ws.reduce((a, s) => a + s.weight * s.reps, 0) });
    });
    const pr = S.prs[progEx];
    return `<div style="margin-top:18px"><label class="fld" for="pe">Ćwiczenie</label>
        <select id="pe" class="in" onchange="setProgEx(this.value)">${names.map(n => `<option value="${esc(n)}" ${n === progEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
        <div class="sec" style="margin-top:20px"><div class="sec-h"><h2>Szacowany maks (1RM)</h2><span class="sub">kg</span></div><div class="panel">${lineChart(pts.map(p => p.e), pts.map(p => p.label))}</div></div>
        ${pr ? `<div class="note-row" style="margin-top:14px">${ic('trophy')}<span>Rekord: ${fmt1(pr.weight)} kg × ${pr.reps}, ${niceDate(pr.date)}.</span></div>` : ''}
        <div class="sec"><div class="sec-h"><h2>Ostatnie sesje</h2></div><div class="panel" style="padding:4px 16px">${[...pts].reverse().slice(0, 8).map(p => `<div class="prrow"><div><div style="font-weight:700">${niceDate(p.date)}</div><div class="muted" style="font-size:12.5px;font-weight:600">${fmt(p.vol)} kg tonażu</div></div><div class="big">${fmt1(p.best.weight)} × ${p.best.reps}</div></div>`).join('')}</div></div>`;

const st = { key: null, steps: [], idx: 0, left: 0, run: false, iv: null, end: 0 };
function buildSteps(key) {
    const out = [];
    (ROUTINES[key] || []).forEach(r => {
        if (r.sides) { out.push({ n: r.n + ' (lewa strona)', s: r.s, h: r.h }); out.push({ n: r.n + ' (prawa strona)', s: r.s, h: r.h }); }
        else out.push({ n: r.n, s: r.s, h: r.h });

}
function stretchSelect(key) {
    stretchStop();
    st.key = key; st.steps = buildSteps(key); st.idx = 0; st.left = st.steps[0].s; renderStretch();
    $$('#st-chips .chip').forEach(c => c.classList.toggle('on', c.dataset.k === key));
}
function goStretch(key) { st.key = key; st.steps = buildSteps(key); st.idx = 0; st.left = st.steps[0].s; go('recovery'); }
function stretchStop() { clearInterval(st.iv); st.iv = null; st.run = false; }
function stretchToggle() {
    if (!st.steps.length) return;
    if (st.run) { stretchStop(); renderStretch(); return; }
    if (st.idx >= st.steps.length) { st.idx = 0; st.left = st.steps[0].s; }
    st.run = true; st.end = Date.now() + st.left * 1000;

        if (st.left <= 0) {

            if (st.idx >= st.steps.length) { stretchStop(); st.left = 0; renderStretch(); toast('Rozciąganie zakończone', 'check'); return; }
            st.left = st.steps[st.idx].s; st.end = Date.now() + st.left * 1000; renderStretch(); return;

    renderStretch();
}
function stretchSkip() {

}

let lastInsights = [];
function exSeries(name) {
    const out = [];
    [...S.history].reverse().forEach(h => {
        const e = h.exercises.find(x => x.name === name); if (!e) return;
        const ws = workSets(e).filter(s => s.weight > 0 && s.reps > 0); if (!ws.length) return;
        out.push(Math.max(...ws.map(s => e1rm(s.weight, s.reps))));
    });
    return out;
}
function muscleSets(days) {

    S.history.filter(h => h.date >= since).forEach(h => h.exercises.forEach(e => { const m = e.muscle || muscleOf(e.name); c[m] = (c[m] || 0) + workSets(e).length; }));
    return c;
}
function buildInsights() {
    const out = [], now = new Date(), tStr = todayStr(), mon = mondayOf(now), hist = S.history;
    if (!hist.length) return [{ tone: 'info', icon: 'bolt', title: 'Zacznij pierwszy trening', text: 'Po kilku sesjach pokażę tu wnioski: zastoje, balans partii i postępy.' }];
    const wk = weekSessions(mon);
    for (let i = 0; i < 7; i++) {
        const d = addDays(mon, i), ds = ymd(d); if (ds >= tStr) break;
        const k = SCHEDULE[d.getDay()];
        if (k && !wk.some(h => h.planKey === k)) { out.push({ tone: 'warn', icon: 'calendar', title: `Zaległy trening: ${planParts(k).short}`, text: `Był w planie na ${DAY_PL[d.getDay()]}. Możesz go nadrobić dziś.`, act: { label: 'Nadrób teraz', type: 'start', arg: k } }); break; }
    }
    const v1 = weekSessions(addDays(mon, -7)).reduce((a, h) => a + sessionVolume(h), 0), v2 = weekSessions(addDays(mon, -14)).reduce((a, h) => a + sessionVolume(h), 0);
    if (v1 > 0 && v2 > 0) {
        const d = Math.round((v1 - v2) / v2 * 100);
        if (Math.abs(d) >= 5) out.push({ tone: d > 0 ? 'good' : 'warn', icon: 'chart', title: `Tonaż w zeszłym tygodniu ${d > 0 ? '+' : '−'}${Math.abs(d)}%`, text: `${fmt(v1)} kg wobec ${fmt(v2)} kg tydzień wcześniej.` });
    }
    const names = []; hist.forEach(h => h.exercises.forEach(e => { if (!names.includes(e.name)) names.push(e.name); }));
    const stag = [];
    let bestName = null, bestGain = 0;
    names.forEach(n => {
        const s = exSeries(n);
        if (s.length >= 4) { const rec = s.slice(-3), bef = s.slice(0, -3); if (Math.max(...rec) <= Math.max(...bef) + 0.01) stag.push(n); }
        if (s.length >= 2) { const g = s[s.length - 1] - s[0]; if (g > bestGain) { bestGain = g; bestName = n; } }
    });
    stag.slice(0, 2).forEach(n => out.push({ tone: 'warn', icon: 'target', title: `Zastój: ${n}`, text: 'Od 3 sesji bez poprawy szacowanego 1RM. Spróbuj zmienić zakres powtórzeń, dodać serię albo zrobić lżejszy tydzień.' }));
    if (bestName && bestGain >= 2.5) out.push({ tone: 'good', icon: 'trophy', title: `Najlepszy progres: ${bestName}`, text: `Szacowane 1RM wzrosło o ${fmt1(bestGain)} kg od pierwszego zapisu.` });
    const c = muscleSets(28), push = (c['Klatka'] || 0) + (c['Barki'] || 0) + (c['Triceps'] || 0), pull = (c['Plecy'] || 0) + (c['Tył barków'] || 0) + (c['Biceps'] || 0);
    if (push >= 12 && pull >= 12) {
        const r = push / pull;
        if (r > 1.4 || r < 0.7) out.push({ tone: 'warn', icon: 'scale', title: r > 1.4 ? 'Przewaga pchania nad ciągnięciem' : 'Przewaga ciągnięcia nad pchaniem', text: `W 4 tygodnie: ${push} serii pchających i ${pull} ciągnących. Zbalansowanie pomaga barkom.` });
        else out.push({ tone: 'good', icon: 'scale', title: 'Dobry balans pchanie i ciągnięcie', text: `W 4 tygodnie: ${push} serii pchających i ${pull} ciągnących.` });
    }
    const c14 = muscleSets(14), recent = hist.filter(h => h.date >= ymd(addDays(now, -13))).length;
    if (recent >= 3) { const miss = CORE_MUSCLES.filter(m => !(c14[m] > 0)); if (miss.length) out.push({ tone: 'info', icon: 'info', title: `Brak serii na: ${miss.join(', ')}`, text: 'Nic w ostatnich 14 dniach. Sprawdź, czy to zamierzone.' }); }
    if (weeklyStreak() >= 6) out.push({ tone: 'info', icon: 'battery', title: 'Rozważ tydzień deload', text: `Trenujesz zgodnie z celem od ${weeklyStreak()} tygodni. Lżejszy tydzień (około 40% mniej serii) pomaga się zregenerować.`, act: { label: 'Test gotowości', type: 'go', arg: 'recovery' } });

    if (!out.length) out.push({ tone: 'good', icon: 'check', title: 'Wszystko na dobrej drodze', text: 'Brak ostrzeżeń. Trzymaj plan.' });

}

 IV.left=l;const e=$('#iv-box');if(e)e.innerHTML=ivFace();}

    e.sets.forEach((s,j)=>{

    let n=0;
    w.exercises.forEach(e=>{
      const sg=suggestion(e);
      if(!sg) return;
      const s=e.sets.find(x=>x.type!=='w'&&!x.done);
      if(s){s.weight=sg.weight;s.reps=sg.reps;n++;}
    });
    save(); RENDER.workout();

<script>
(function(){

  const on = k => !S || S.settings[k] !== false;
  const colEx = new WeakSet();
  const fmtN = n => String(Math.round(n*100)/100).replace('.',',');
  const isSetInput = el => !!(el && el.matches && el.matches('.set input'));
  const rowOf = el => { const r = el.closest('.set'); const m = r && r.id.match(/^set-(\d+)-(\d+)$/); return m ? {i:+m[1], j:+m[2], row:r} : null; };

  /* ---------- Toast z akcją ---------- */
  let actTimer = null;
  window.toastAct = function(msg, label, fn){
    const t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(actTimer);
    t.className = 'toast act';
    t.innerHTML = `<span>${esc(msg)}</span><button type="button">${esc(label)}</button>`;
    void t.offsetWidth; t.classList.add('show');
    t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
    actTimer = setTimeout(() => t.classList.remove('show'), 5500);
  };

  /* ---------- Karta ćwiczenia: zwijanie ---------- */
  const _exCard = window.exerciseCard;
  window.exerciseCard = function(e, i){
    let h = _exCard(e, i);
    const col = colEx.has(e);
    h = h.replace('<div class="ex-h">', `<div class="ex-h" data-x="${i}"><span class="ex-chev" aria-hidden="true">${ic('chev-d')}</span>`);
    h = h.replace('<div class="grow"><h3>', `<div class="grow" role="button" tabindex="0" aria-expanded="${!col}" aria-label="Zwiń lub rozwiń ćwiczenie"><h3>`);
    if (col){
      const d = e.sets.filter(s => s.done);
      const txt = d.length ? d.map(s => `${s.weight}×${s.reps}`).join(' · ') : 'bez zaliczonych serii';
      h = h.replace('class="ex ', 'class="ex collapsed ').replace('<div class="sets">', `<div class="ex-sum"><span class="n">${d.length}/${e.sets.length}</span><span>${esc(txt)}</span></div><div class="sets">`);
    }
    return h;
  };
  document.addEventListener('click', ev => {
    const h = ev.target.closest('#s-workout .ex-h');
    if (!h || ev.target.closest('button')) return;
    const ex = S.activeWorkout && S.activeWorkout.exercises[+h.dataset.x];
    if (!ex) return;
    if (colEx.has(ex)) colEx.delete(ex); else colEx.add(ex);
    renderExercise(+h.dataset.x); buzz(6);
  });
  window.toggleAllEx = function(){
    const w = S.activeWorkout; if (!w) return;
    const anyOpen = w.exercises.some(e => !colEx.has(e));
    w.exercises.forEach(e => anyOpen ? colEx.add(e) : colEx.delete(e));
    RENDER.workout();
    toast(anyOpen ? 'Zwinięto wszystkie ćwiczenia' : 'Rozwinięto wszystkie ćwiczenia', 'list');
  };

  /* ---------- Wiersz serii ---------- */
  const _setRow13 = window.setRow;
  window.setRow = function(i, j, s, lbl, pv){

      .replace(`onclick="toggleSet(${i},${j})"`, `onclick="smartFinishSet(${i},${j})"`)
      .replace('aria-label="Typ serii. Zmień"', 'aria-label="Opcje serii"');
  };

  /* ---------- Kolejne serie ---------- */
  function allOpen(){
    const out = [], w = S.activeWorkout; if (!w) return out;
    w.exercises.forEach((e, i) => e.sets.forEach((s, j) => { if (!s.done) out.push({i, j, e, s}); }));
    return out;

    const e = w.exercises[i], open = allOpen();
    const nx = open.find(n => n.i > i || (n.i === i && n.j > j));
    if (e.sets.every(s => s.done) && on('autoCollapse') && nx && nx.i !== i && !colEx.has(e)){ colEx.add(e); renderExercise(i); }
    if (!nx) return;
    if (colEx.has(nx.e)){ colEx.delete(nx.e); renderExercise(nx.i); }
    const row = $('#set-' + nx.i + '-' + nx.j); if (!row) return;
    if (typing){
      const inp = row.querySelector('input');
      if (inp){ inp.focus({preventScroll:true}); if (inp.select) inp.select(); }
      row.scrollIntoView({behavior:'smooth', block:'center'});
    } else if (viaFab || nx.i !== i) row.scrollIntoView({behavior:'smooth', block:'center'});
  }
  window.smartFinishSet = function(i, j, viaFab){
    const w = S.activeWorkout; if (!w) return;
    const s = w.exercises[i] && w.exercises[i].sets[j]; if (!s) return;
    const was = s.done, typing = !!qCur || isSetInput(document.activeElement);
    toggleSet(i, j);
    const s2 = S.activeWorkout && S.activeWorkout.exercises[i] && S.activeWorkout.exercises[i].sets[j];
    if (!s2 || s2.done === was){
      if (!was){ const ins = $$('#set-' + i + '-' + j + ' input'); if (ins[1]) setTimeout(() => ins[1].focus(), 60); }
      return;
    }
    if (s2.done) setTimeout(() => { advance(i, j, typing, viaFab); updateFab(); }, 60);
    else updateFab();
  };

  /* ---------- Pasek ± nad klawiaturą ---------- */
  const qb = document.createElement('div');
  qb.id = 'qbar'; qb.className = 'qbar'; qb.setAttribute('role', 'toolbar'); qb.setAttribute('aria-label', 'Szybka korekta wartości');
  let qCur = null, qHide = null;
  function syncKb(){
    const vv = window.visualViewport; if (!vv) return;
    document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
  }
  function renderQ(){
    if (!qCur) return;
    const st = S.settings.step || 2.5;
    const b = qCur.field === 'weight' ? [[-2*st,'−'+fmtN(2*st)],[-st,'−'+fmtN(st)],[st,'+'+fmtN(st)],[2*st,'+'+fmtN(2*st)]] : [[-2,'−2'],[-1,'−1'],[1,'+1'],[2,'+2']];
    qb.innerHTML = `<span class="q-lbl">${qCur.field === 'weight' ? 'kg' : 'powt.'}</span>` + b.map(([d, l]) => `<button type="button" data-d="${d}">${l}</button>`).join('') + `<button type="button" class="q-ok" data-ok="1" aria-label="Zalicz serię">${ic('check')}</button>`;
  }
  function hideQ(){ qCur = null; qb.className = 'qbar'; document.body.classList.remove('q-on'); updateFab(); }
  ['pointerdown', 'mousedown'].forEach(t => qb.addEventListener(t, e => e.preventDefault()));
  qb.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !qCur) return;
    const el = qCur.el; if (!document.contains(el)){ hideQ(); return; }
    if (b.dataset.ok){ smartFinishSet(qCur.i, qCur.j); return; }
    const v = Math.max(0, Math.round((num(el.value) + (+b.dataset.d)) * 100) / 100);
    el.value = v || '';
    el.dispatchEvent(new Event('change', {bubbles:true}));
    buzz(6);
  });
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!isSetInput(el) || !on('qbar') || !S.activeWorkout) return;
    const r = rowOf(el); if (!r) return;
    clearTimeout(qHide);
    qCur = {i:r.i, j:r.j, el, field:$$('input', r.row).indexOf(el) === 0 ? 'weight' : 'reps'};
    renderQ(); syncKb();
    qb.className = 'qbar show ' + planCls(S.activeWorkout.planKey); document.body.classList.add('q-on');
    updateFab();
    setTimeout(() => { try { el.scrollIntoView({block:'center', behavior:'smooth'}); } catch(_){} }, 320);
  });
  document.addEventListener('focusout', () => {
    if (!qCur) return;
    clearTimeout(qHide);
    qHide = setTimeout(() => { if (!isSetInput(document.activeElement)) hideQ(); }, 160);
  });
  if (window.visualViewport){ visualViewport.addEventListener('resize', syncKb); visualViewport.addEventListener('scroll', syncKb); }

  /* Enter: kg → powt. → zalicz */
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][tabindex]')){ e.preventDefault(); e.target.click(); return; }
    if (e.key !== 'Enter' || !isSetInput(e.target)) return;
    e.preventDefault();
    const r = rowOf(e.target); if (!r) return;
    const ins = $$('input', r.row);
    if (e.target === ins[0]) ins[1].focus();
    else { e.target.dispatchEvent(new Event('change', {bubbles:true})); smartFinishSet(r.i, r.j); }
  });

  /* ---------- Przycisk „Następna seria” ---------- */
  const fab = document.createElement('button');
  fab.id = 'nextfab'; fab.type = 'button'; fab.className = 'nextfab hidden';
  fab.addEventListener('click', () => {
    const w = S.activeWorkout; if (!w) return;
    const n = allOpen()[0];
    if (!n){ finishWorkout(); return; }
    if (colEx.has(n.e)){ colEx.delete(n.e); renderExercise(n.i); }
    const row = $('#set-' + n.i + '-' + n.j); if (!row) return;
    const ins = $$('input', row);
    if (!(num(ins[1].value) > 0)){
      row.scrollIntoView({behavior:'smooth', block:'center'});
      const t = num(ins[0].value) > 0 ? ins[1] : ins[0];
      setTimeout(() => t.focus(), 280);
      toast('Uzupełnij tę serię, potem zalicz', 'info'); return;
    }
    const wt = num(ins[0].value), rp = num(ins[1].value), name = n.e.name;
    smartFinishSet(n.i, n.j, true);
    const s2 = S.activeWorkout && S.activeWorkout.exercises[n.i] && S.activeWorkout.exercises[n.i].sets[n.j];
    if (s2 && s2.done && !s2.pr) toastAct(`Zaliczono: ${name}, ${wt}×${rp}`, 'Cofnij', () => {
      const x = S.activeWorkout && S.activeWorkout.exercises[n.i] && S.activeWorkout.exercises[n.i].sets[n.j];
      if (x && x.done){ toggleSet(n.i, n.j); updateFab(); }
    });
  });
  function updateFab(){
    const w = S && S.activeWorkout;
    const sheetOpen = $('#sheet').classList.contains('open');
    const show = !!(w && w.exercises.length && current === 'workout' && on('fab') && !qCur && !sheetOpen);
    fab.classList.toggle('hidden', !show);
    document.body.classList.toggle('fab-on', show);
    if (!show) return;
    const n = allOpen()[0];
    fab.className = 'nextfab ' + planCls(w.planKey);
    let key, html;
    if (!n){ key = 'end'; html = `<span class="nf-ic">${ic('check')}</span><span class="nf-t"><b>Wszystko zaliczone</b><small>Zakończ i zapisz trening</small></span>`; }
    else {
      const tot = n.e.sets.filter(s => s.type !== 'w').length;
      const k = n.e.sets.slice(0, n.j + 1).filter(s => s.type !== 'w').length;
      const lbl = n.s.type === 'w' ? 'Rozgrzewka' : `Seria ${k}/${tot}`;
      const val = (n.s.weight || n.s.reps) ? `${n.s.weight || '?'} kg × ${n.s.reps || '?'}` : 'uzupełnij wartości';
      key = n.i + '-' + n.j + '-' + n.s.weight + '-' + n.s.reps;
      html = `<span class="nf-ic">${ic('check')}</span><span class="nf-t"><b>${esc(n.e.name)}</b><small>${lbl} · ${val}</small></span>`;
    }
    if (fab.dataset.k !== key){ fab.innerHTML = html; fab.dataset.k = key; }
  }
  new MutationObserver(() => document.body.classList.toggle('dock-on', !$('#dock').classList.contains('hidden')))
    .observe($('#dock'), {attributes:true, attributeFilter:['class']});

  /* ---------- Opcje serii ---------- */
  window.cycleType = (i, j) => openSetMenu(i, j);
  function openSetMenu(i, j){
    const e = S.activeWorkout.exercises[i], s = e.sets[j], t = s.type || 'n';
    openSheet(`<h3 class="sh-t">Opcje serii</h3><p class="muted" style="margin-bottom:10px">${esc(e.name)}</p>
      <label class="fld">Typ serii</label>
      <div class="seg">${[['n','Robocza'],['w','Rozgrzewka'],['d','Drop set']].map(([v, l]) => `<button class="${t === v ? 'on' : ''}" onclick="setSetType(${i},${j},'${v}')">${l}</button>`).join('')}</div>
      <p class="muted" style="font-size:12.5px;margin:8px 0 4px">Rozgrzewka nie liczy się do tonażu ani rekordów.</p>
      <div class="sh-list">
        <button class="li" onclick="dupSet(${i},${j})">${ic('copy')}<div class="grow"><div class="t">Duplikuj serię</div></div></button>
        ${s.done ? `<button class="li" onclick="closeSheet();toggleSet(${i},${j})">${ic('undo')}<div class="grow"><div class="t">Cofnij zaliczenie</div></div></button>` : ''}
        <button class="li bad" onclick="delSet(${i},${j})">${ic('trash')}<div class="grow"><div class="t">Usuń serię</div></div></button></div>`);
  }
  window.setSetType = function(i, j, v){
    const names = {n:'Seria robocza', w:'Rozgrzewka (bez tonażu)', d:'Drop set'};
    S.activeWorkout.exercises[i].sets[j].type = v; save(); closeSheet(); renderExercise(i); toast(names[v], 'info');
  };
  window.dupSet = function(i, j){
    const e = S.activeWorkout.exercises[i], s = e.sets[j];
    e.sets.splice(j + 1, 0, {weight:s.weight, reps:s.reps, done:false, type:s.type || 'n'});
    save(); closeSheet(); renderExercise(i); toast('Dodano kopię serii', 'copy');
  };
  window.delSet = function(i, j){
    const w = S.activeWorkout, e = w.exercises[i]; closeSheet();
    if (e.sets.length < 2){ toast('Ćwiczenie musi mieć co najmniej jedną serię', 'info'); return; }
    const s = e.sets.splice(j, 1)[0]; save(); renderExercise(i);
    toastAct('Usunięto serię', 'Cofnij', () => { if (S.activeWorkout === w && w.exercises.includes(e)){ e.sets.splice(j, 0, s); save(); renderExercise(w.exercises.indexOf(e)); } });
  };
  const _rmSet = window.removeSet;
  window.removeSet = function(i){
    const w = S.activeWorkout, e = w.exercises[i]; if (e.sets.length < 2) return;
    const s = e.sets[e.sets.length - 1]; _rmSet(i);
    toastAct('Usunięto ostatnią serię', 'Cofnij', () => { if (S.activeWorkout === w && w.exercises.includes(e)){ e.sets.push(s); save(); renderExercise(w.exercises.indexOf(e)); } });
  };
  const _rmEx = window.removeExercise;
  window.removeExercise = async function(i){
    const w = S.activeWorkout, e = w.exercises[i], n = w.exercises.length;
    await _rmEx(i);
    if (S.activeWorkout === w && w.exercises.length < n)
      toastAct('Usunięto ćwiczenie', 'Cofnij', () => { if (S.activeWorkout === w){ w.exercises.splice(Math.min(i, w.exercises.length), 0, e); save(); RENDER.workout(); } });
  };

  /* ---------- Timer przerwy: dotknij, by zmienić ---------- */
  window.restSheet = function(){
    openSheet(`<h3 class="sh-t">Przerwa</h3><p class="muted">Wybierz czas, liczony od teraz.</p>
      <div class="q-grid">${[30,45,60,90,120,150,180,240,300].map(n => `<button type="button" onclick="closeSheet();startRest(${n})">${fmtClock(n)}</button>`).join('')}</div>
      <button class="btn ghost block" onclick="closeSheet();stopRest(false)">Zakończ przerwę</button>`);
  };
  document.addEventListener('click', e => { if (e.target.closest('#dock .ring, #dock .grow')) restSheet(); });

  /* ---------- Dashboard ---------- */
  window.swapPlanSheet = function(){
    const k0 = SCHEDULE[new Date().getDay()];
    openSheet(`<h3 class="sh-t">Wybierz trening</h3><p class="muted" style="margin-bottom:6px">Zacznij inny niż zaplanowany na dziś.</p><div class="sh-list">${PLAN_ORDER.map(k => {
      const pp = planParts(k);
      return `<button class="li ${planCls(k)}" onclick="startWorkout('${k}')"><div class="mini-plate">${PLAN_DAY_ABBR[k]}</div><div class="grow"><div class="t">${esc(pp.short)}</div><div class="s">${esc(pp.sub)}${k === k0 ? ' · w planie na dziś' : ''}</div></div>${ic('chev-r', 'chev')}</button>`;
    }).join('')}<button class="li" onclick="closeSheet();startFreeWorkout()">${ic('plus')}<div class="grow"><div class="t">Własny trening bez planu</div></div></button></div>`);
  };
  window.amountSheet = function(kind){
    const w = kind === 'water', h = H(), goal = w ? S.settings.waterGoal : S.settings.proteinGoal, cur = w ? h.water : (h.protein || 0), unit = w ? 'ml' : 'g';
    const opts = w ? [100,250,330,500,750,1000] : [10,20,25,30,40,50];
    const adds = (w ? h.waterAdds : h.proteinAdds) || [], last = adds.length ? adds[adds.length - 1] : 0;
    openSheet(`<h3 class="sh-t">${w ? 'Woda' : 'Białko'}</h3><p class="muted">${fmt(cur)} z ${fmt(goal)} ${unit} dziś</p>
      <div class="bar ${w ? 'blue' : ''}" style="margin:12px 0 4px"><i style="width:${clamp(cur / goal * 100, 0, 100)}%"></i></div>
      <div class="q-grid">${opts.map(x => `<button type="button" onclick="amtAdd('${kind}',${x})">+${x} ${unit}</button>`).join('')}</div>
      <div class="amt-custom"><input id="amt-c" class="in" type="text" inputmode="decimal" placeholder="Własna ilość, ${unit}" aria-label="Własna ilość"><button class="btn" onclick="amtAdd('${kind}',$('#amt-c').value)">Dodaj</button></div>
      ${last ? `<button class="btn ghost block" style="margin-top:10px" onclick="closeSheet();${w ? 'undoWater' : 'undoProtein'}()">${ic('undo')} Cofnij ostatnie (${last} ${unit})</button>` : ''}`);
  };
  window.amtAdd = function(kind, v){
    v = Math.round(num(v)); if (!(v > 0)){ toast('Podaj ilość', 'info'); return; }
    const w = kind === 'water', goal = w ? S.settings.waterGoal : S.settings.proteinGoal, before = w ? H().water : (H().protein || 0);
    closeSheet(); (w ? addWater : addProtein)(v);
    if (before + v < goal) toast(`+${v} ${w ? 'ml wody' : 'g białka'}`, w ? 'droplet' : 'fork');
  };
  function dayTap(ds){
    if (sessionsOn(ds).length){ selectDay(ds); return; }
    const key = SCHEDULE[parseYmd(ds).getDay()];
    if (key){ openPlanSheet(key); return; }
    const nx = nextPlanned(new Date());
    openSheet(`<h3 class="sh-t">${longDate(ds)}</h3><p class="muted" style="margin-bottom:6px">Dzień bez treningu w planie.</p><div class="sh-list">
      <button class="li" onclick="closeSheet();startFreeWorkout()">${ic('dumbbell')}<div class="grow"><div class="t">Własny trening</div></div></button>
      <button class="li" onclick="closeSheet();goStretch('${nx ? nx.key : 'push'}')">${ic('stretch')}<div class="grow"><div class="t">Rozciąganie</div></div></button>
      <button class="li" onclick="closeSheet();selectDay('${ds}')">${ic('calendar')}<div class="grow"><div class="t">Zobacz w kalendarzu</div></div></button></div>`);
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('#s-dash')) return;
    const wd = e.target.closest('.wd[data-ds]'); if (wd){ dayTap(wd.dataset.ds); return; }
    const tile = e.target.closest('.tile[data-kind]'); if (tile && !e.target.closest('button')){ amountSheet(tile.dataset.kind); return; }
    const lc = e.target.closest('.smart-card.tap'); if (lc){ selectDay(lc.dataset.ds); return; }
    if (e.target.closest('.tapmeta')){ const xp = S.user.xp % 500; toast(`${500 - xp} XP do poziomu ${S.user.level + 1}`, 'bolt'); }
  });
  const _dash13 = RENDER.dash;
  RENDER.dash = function(){
    if (!S) return;
    _dash13();
    const root = $('#s-dash'); if (!root) return;
    const hero = root.querySelector('.hero');
    if (hero && hero.querySelector('[onclick^="startWorkout("]')){
      const lab = hero.querySelector('.hero-top .muted');
      if (lab && !lab.querySelector('.chip-mini')) lab.insertAdjacentHTML('beforeend', `<button type="button" class="chip-mini" onclick="swapPlanSheet()">Zmień${ic('chev-d')}</button>`);
    }
    const mon = mondayOf(new Date());
    root.querySelectorAll('.week .wd').forEach((el, k) => {
      const ds = ymd(addDays(mon, k));
      el.dataset.ds = ds; el.setAttribute('role', 'button'); el.tabIndex = 0; el.setAttribute('aria-label', longDate(ds));
    });
    root.querySelectorAll('.tile').forEach(t => {
      const k = t.querySelector('.k'), txt = k ? k.textContent : '';
      const kind = /Woda/.test(txt) ? 'water' : /Białko/.test(txt) ? 'protein' : null;
      if (kind){ t.dataset.kind = kind; t.classList.add('tap'); k.insertAdjacentHTML('beforeend', `<span class="more">${ic('chev-r')}</span>`); }
    });
    const lc = root.querySelector('.smart-card');
    if (lc && S.history[0]){ lc.classList.add('tap'); lc.dataset.ds = S.history[0].date; lc.setAttribute('role', 'button'); lc.tabIndex = 0; }
    const meta = root.querySelector('.meta'); if (meta) meta.classList.add('tapmeta');
  };

  /* ---------- Trening: wskazówka i odświeżanie ---------- */
  window.dismissTip = function(){ S.settings.tipV13 = true; save(); const t = $('#tip13'); if (t) t.remove(); };
  const _wk13 = RENDER.workout;
  RENDER.workout = function(){
    _wk13();
    if (S.activeWorkout && !S.settings.tipV13){
      const l = $('#ex-list');
      if (l && !$('#tip13')) l.insertAdjacentHTML('beforebegin', `<div class="tip13" id="tip13"><div class="h">${ic('bolt')}Szybsze wpisywanie</div><ul>
        <li>Dotknij pola kg lub powt.: nad klawiaturą pojawi się pasek ±.</li>
        <li>Dotknij numeru serii: typ, duplikat, usunięcie.</li>
        <li>Dotknij nazwy ćwiczenia: zwija lub rozwija kartę.</li>
        <li>Przycisk u dołu zalicza kolejną serię jednym dotknięciem.</li></ul>
        <button class="btn sm" onclick="dismissTip()">Rozumiem</button></div>`);
    }
    updateFab();
  };
  const _rEx = window.renderExercise;
  window.renderExercise = function(i){ _rEx(i); updateFab(); };

  /* ---------- Ustawienia ---------- */
  const _set13 = RENDER.settings;
  RENDER.settings = function(){
    _set13();
    const anchor = $('#s-settings .switch'); if (!anchor) return;
    anchor.closest('.panel').insertAdjacentHTML('afterend', `<div class="panel" style="padding:4px 16px;margin-top:12px">
      ${sw('fab', 'Przycisk „Następna seria”', 'Zalicza kolejną serię jednym dotknięciem')}
      ${sw('qbar', 'Pasek ± nad klawiaturą', 'Szybka zmiana kg i powtórzeń')}
      ${sw('autoCollapse', 'Zwijaj ukończone ćwiczenia', 'Po ostatniej serii karta zwija się sama')}
      <div class="opt"><div><b>Wskazówki w treningu</b><small>Pokaż ponownie krótką ściągę</small></div><button class="btn sm ghost" onclick="S.settings.tipV13=false;save();toast('Pojawią się w treningu','info')">Pokaż</button></div></div>`);
  };

  /* ---------- Start ---------- */
  window.addEventListener('load', () => {
    ['fab', 'qbar', 'autoCollapse'].forEach(k => { if (S.settings[k] === undefined) S.settings[k] = true; });
    document.body.appendChild(qb); document.body.appendChild(fab);
    setInterval(() => {
      if (qCur && !document.contains(qCur.el) && !isSetInput(document.activeElement)) hideQ();
      updateFab();
    }, 500);
  });
})();
</script>

/* szkło */

/* pływający pasek zakładek z ruchomym "szkiełkiem" */

<script>
(function(){
  /* ruchome szkiełko pod aktywną zakładką */
  const navin = document.querySelector('nav.tabs .navin');
  function syncNav(){
    const k = [...navin.children].findIndex(b => b.classList.contains('on'));
    navin.style.setProperty('--ni', Math.max(0, k));
    navin.classList.toggle('none', k < 0);
  }
  new MutationObserver(syncNav).observe(navin, {subtree:true, attributes:true, attributeFilter:['class']});
  syncNav(); window.addEventListener('load', syncNav);

  /* przeciągnięcie uchwytu w dół zamyka arkusz */
  const sh = document.getElementById('sheet');
  let y0 = 0, dy = 0, t0 = 0, drag = false;
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('.grab')) return;
    drag = true; y0 = e.clientY; dy = 0; t0 = Date.now();
    sh.style.transition = 'none'; try { sh.setPointerCapture(e.pointerId); } catch (_) {}
  });
  sh.addEventListener('pointermove', e => {
    if (!drag) return;
    dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (!drag) return; drag = false;
    const v = dy / Math.max(1, Date.now() - t0);
    sh.style.transition = ''; sh.style.transform = '';
    if (dy > 110 || v > .6) closeSheet();
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();
</script>

   3) rozbudowane podsumowanie po treningu + porównania wagowe (10 000 kg = autobus)
   ===================================================================== */

/* ---------- drabina porównań wagowych ---------- */
const LADDER = [
  [5, 'duży arbuz', '🍉'], [25, 'worek cementu', '🧱'], [75, 'dorosły człowiek', '🧍'], [100, 'panda wielka', '🐼'],

  [1000, 'mały samochód', '🚗'], [1500, 'hipopotam', '🦛'], [2300, 'nosorożec', '🦏'], [5000, 'słoń afrykański', '🐘'],
  [8000, 'tyranozaur', '🦖'], [10000, 'autobus miejski', '🚌'], [20000, 'wóz strażacki', '🚒'], [30000, 'wieloryb garbaty', '🐋'],
  [41000, 'Boeing 737 (pusty)', '✈️'], [62000, 'czołg Leopard 2', '🛡️'], [120000, 'lokomotywa', '🚂'], [150000, 'płetwal błękitny', '🐳'],
  [277000, 'Airbus A380 (pusty)', '🛫'], [1000000, 'pociąg towarowy', '🚆'], [10100000, 'Wieża Eiffla', '🗼']
];
const g_obj = kg => { let o = null; for (const x of LADDER) { if (x[0] <= kg) o = x; else break; } return o; };
const g_nextObj = kg => LADDER.find(x => x[0] > kg) || null;
function g_cnt(c) { return c < 1.1 ? '1' : c >= 10 ? fmt(c) : fmt1(c); }
function g_eq(kg) {
  const o = g_obj(kg); if (!o) return null;
  return { w: o[0], name: o[1], em: o[2], c: kg / o[0], cs: g_cnt(kg / o[0]) };
}

/* ---------- pomocnicze ---------- */
const MS_DAY = 86400000;
const g_pl = (n, a, b, c) => n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) ? b : c;
const g_sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const g_vol = h => sessionVolume(h);
const g_sets = h => h.completedSets != null ? h.completedSets : h.exercises.reduce((a, e) => a + workSets(e).length, 0);
const g_inRange = (from, to) => S.history.filter(h => (!from || h.date >= from) && (!to || h.date <= to));
const g_before = (h, s) => h.id !== s.id && (h.date < s.date || (h.date === s.date && h.id < s.id));

function g_nice(mn, mx, n) {
  if (!(mx > mn)) mx = mn + 1;
  const raw = (mx - mn) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10, step = nf * p;

/* ---------- uniwersalny wykres SVG (słupki / linia) z interakcją ---------- */
const G15 = {};
function g_chart(id, o) {
  const W = 340, H = o.h || 190, L = o.L || 40, R = 10, T = 12, B = 24, pts = o.pts, n = pts.length;

  else X = i => n > 1 ? L + 8 + (iw - 16) * i / (n - 1) : L + iw / 2;

  }

    });
  } else if (n > 1) {

    if (o.area !== false) s += `<path d="${d} L${X(n - 1).toFixed(1)} ${H - B} L${X(0).toFixed(1)} ${H - B}Z" fill="url(#${id}-g)"/>`;
  }
  if (o.trendLine && n > 1) s += `<line class="g15-tr" x1="${X(0).toFixed(1)}" y1="${Y(o.trendLine[0]).toFixed(1)}" x2="${X(n - 1).toFixed(1)}" y2="${Y(o.trendLine[1]).toFixed(1)}"/>`;
  if (o.ma) {
    let seg = '', open = false;
    o.ma.forEach((v, i) => { if (v == null) { open = false; return; } seg += `${open ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `; open = true; });
    if (seg) s += `<path class="g15-ma" d="${seg}"/>`;
  }
